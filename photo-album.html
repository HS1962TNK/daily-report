<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工事写真台帳</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:#e8e8e6;color:#1a1a1a}

.toolbar{background:#1B3A6B;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.toolbar h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}
.tb-btn{padding:8px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.tb-btn.primary{background:#fff;color:#1B3A6B}
.tb-btn.green{background:#22c55e;color:#fff}
.tb-btn.orange{background:#f59e0b;color:#fff}
.tb-btn.ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}

.header-form{background:#fff;margin:12px auto;max-width:210mm;padding:16px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.header-form .hf-title{font-size:13px;font-weight:700;color:#374151;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.hf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hf-field label{font-size:11px;color:#6b7280;display:block;margin-bottom:3px;font-weight:600}
.hf-field input{width:100%;padding:8px 10px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:13px;font-family:inherit}
.hf-field input:focus{outline:none;border-color:#1B3A6B}
.site-select{padding:7px 10px;border:1.5px solid #1B3A6B;border-radius:7px;font-size:12px;font-family:inherit;background:#EBF4FF;color:#1B3A6B;font-weight:600;cursor:pointer;width:220px}
.site-search-wrap{position:relative;display:inline-block}
.site-search-results{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid #1B3A6B;border-radius:8px;max-height:280px;overflow-y:auto;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.site-search-results.show{display:block}
.site-search-item{padding:8px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.site-search-item:hover{background:#EBF4FF}
.site-search-item .ssi-badge{font-size:10px;color:#f59e0b;font-weight:700;flex-shrink:0}
.site-search-empty{padding:12px;font-size:12px;color:#999;text-align:center}
.completed-link{font-size:11px;color:#1B3A6B;cursor:pointer;text-decoration:underline;white-space:nowrap;margin-left:8px}
.cp-year-item,.cp-site-item{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #eee}
.cp-year-item:hover,.cp-site-item:hover{background:#EBF4FF}
.cp-back{padding:8px 12px;font-size:12px;color:#1B3A6B;cursor:pointer;font-weight:600}

.pages{padding:12px 12px 40px}
.page{background:#fff;width:210mm;min-height:297mm;margin:0 auto 16px;padding:14mm 12mm;box-shadow:0 2px 12px rgba(0,0,0,.15);position:relative;display:flex;flex-direction:column}

/* 表紙 */
.cover{padding:0}
.cover-inner{border:2.2px solid #1a1a1a;flex:1;display:flex;flex-direction:column;padding:14mm 16mm;margin:8mm}
.cover-title{font-size:30px;font-weight:700;letter-spacing:5px;text-align:center;padding-top:20mm;padding-bottom:6mm;border-bottom:2.2px solid #1a1a1a}
.cover-spacer{flex:1}
.cover-meta{margin-bottom:24mm}
.cover-meta .cm-row{display:flex;border-bottom:1.2px solid #999;padding:6mm 0;font-size:15px}
.cover-meta .cm-label{width:30mm;font-weight:700;flex-shrink:0;letter-spacing:1px;white-space:nowrap}
.cover-meta .cm-val{flex:1;padding-left:4mm;font-weight:700;letter-spacing:1px}

/* 写真ページ */
.photo-rows{display:flex;flex-direction:column;gap:8mm;flex:1;justify-content:space-evenly}
.photo-row{display:grid;grid-template-columns:120mm 1fr;border:1px solid #333;height:80mm}
.photo-cell{position:relative;background:#f5f5f5;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.photo-cell.drag-over{background:#EBF4FF;outline:2px dashed #1B3A6B;outline-offset:-4px}
.photo-cell.just-moved{outline:3px solid #f59e0b;outline-offset:-3px}
.photo-move{position:absolute;bottom:4px;left:4px;display:flex;gap:4px;z-index:5}
.photo-move button,.photo-move .photo-drag{height:24px;min-width:24px;padding:0 7px;border-radius:12px;background:rgba(0,0,0,.55);color:#fff;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;font-family:inherit;user-select:none}
.photo-move .photo-drag{cursor:grab}
.photo-cell.move-source{outline:3px solid #f59e0b;outline-offset:-3px}
body.move-mode .photo-cell:not(.move-source){cursor:copy}
body.move-mode .photo-cell:not(.move-source):hover{outline:2px dashed #1B3A6B;outline-offset:-4px;background:#EBF4FF}
#move-mode-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:900;background:#1B3A6B;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px)}
#move-mode-bar button{background:#fff;color:#1B3A6B;border:none;border-radius:6px;padding:5px 12px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
.photo-move button:hover,.photo-move .photo-drag:hover{background:rgba(27,58,107,.9)}
.photo-cell img{width:100%;height:100%;object-fit:contain}
.photo-cell .ph-placeholder{text-align:center;color:#bbb;font-size:12px;padding:10px}
.photo-cell .ph-placeholder .ph-icon{font-size:32px;margin-bottom:6px}
.photo-cell input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:5}
.photo-rotate{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:5}
.photo-board{position:absolute;top:4px;left:32px;height:24px;padding:0 8px;border-radius:12px;background:rgba(36,92,59,.9);color:#fff;border:none;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;display:flex;align-items:center;gap:3px;z-index:5}
.photo-board.on{background:#16a34a}
.photo-save{position:absolute;top:4px;left:108px;height:24px;padding:0 8px;border-radius:12px;background:rgba(27,58,107,.9);color:#fff;border:none;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;display:flex;align-items:center;z-index:5}
/* 黒板モーダル */
#board-modal .pp-modal-inner{max-width:900px;max-height:94vh}
.bd-body{display:flex;gap:16px;flex-wrap:wrap}
.bd-preview{flex:1 1 380px;min-width:0;position:relative;background:#f1f5f9;border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:220px}
.bd-preview canvas{max-width:100%;max-height:58vh;display:block}
#bd-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:13px;background:rgba(241,245,249,.85)}
.bd-form{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:8px}
.bd-form label{font-size:12px;font-weight:700;color:#1B3A6B;display:block;margin-bottom:2px}
.bd-form textarea{width:100%;padding:7px 9px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;font-family:inherit;resize:vertical}
.bd-form input[type=text],.bd-form input[type=date]{width:100%;padding:7px 9px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:14px;font-family:inherit}
.bd-chips{display:flex;gap:6px;flex-wrap:wrap}
.bd-chips button{padding:5px 10px;border-radius:14px;border:1.5px solid #1B3A6B;background:#fff;color:#1B3A6B;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.bd-chips button.active{background:#1B3A6B;color:#fff}
.bd-all{font-size:12px;color:#334155;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px;line-height:1.5}
.bd-all input{margin-right:4px;vertical-align:middle}
.bd-footer{border-top:1px solid #eee;padding:10px 16px;display:flex;align-items:center;gap:10px;background:#f8fafc;flex-wrap:wrap}
.bd-footer .bd-msg{font-size:12px;color:#1B3A6B;font-weight:700;margin-right:auto}
.bd-footer button{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1.5px solid #1B3A6B;background:#fff;color:#1B3A6B}
.bd-footer button.primary{background:#245c3b;border-color:#245c3b;color:#fff}
.bd-footer button.danger{border-color:#ef4444;color:#ef4444}
.bd-footer button:disabled{opacity:.45;cursor:default}
.photo-cell .ph-pick-btn{position:relative;z-index:6;margin-top:8px;background:#1B3A6B;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:inherit}
.photo-cell .ph-pick-btn:hover{background:#14294d}

/* 現場の写真ピッカー モーダル */
.pp-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.pp-modal.show{display:flex}
.pp-modal-inner{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.pp-modal-header{padding:14px 16px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;color:#1B3A6B}
.pp-modal-header button{background:none;border:none;font-size:20px;cursor:pointer;color:#888;line-height:1}
.pp-modal-body{padding:14px 16px;overflow-y:auto}
.pp-folder-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pp-folder-chip{padding:5px 12px;border-radius:14px;border:1.5px solid #ddd;background:#fff;color:#555;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit}
.pp-folder-chip.active{background:#1B3A6B;border-color:#1B3A6B;color:#fff;font-weight:700}
.pp-order{margin-left:auto;display:flex;gap:4px}
.pp-order-chip{padding:5px 10px;border-radius:14px;border:1.5px solid #ddd;background:#fff;color:#555;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit}
.pp-order-chip.active{background:#d97706;border-color:#d97706;color:#fff;font-weight:700}
.pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.pp-item{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:#f0f0f0}
.pp-item:hover{border-color:#1B3A6B}
.pp-item img{width:100%;height:100%;object-fit:cover;display:block}
.pp-item .pp-folder{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 4px;text-align:center}
.pp-empty{text-align:center;color:#999;font-size:13px;padding:30px 10px;line-height:1.7}
.pp-note{grid-column:1/-1;font-size:11px;color:#888;margin-bottom:2px}
.pp-more{grid-column:1/-1;margin-top:6px;padding:10px;border:1.5px solid #1B3A6B;border-radius:8px;background:#EBF4FF;color:#1B3A6B;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.pp-more:disabled{opacity:.6;cursor:default}
.pp-modal-inner{position:relative}
#photo-picker-modal .pp-modal-inner{max-width:960px;max-height:90vh}
.pp-grid.size-s{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.pp-grid.size-m{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.pp-grid.size-l{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.pp-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 10px;font-size:12px;color:#555}
.pp-tools .pp-size-chip{padding:3px 10px;border-radius:12px;border:1.5px solid #ddd;background:#fff;color:#555;font-size:12px;cursor:pointer;font-family:inherit}
.pp-tools .pp-size-chip.active{background:#555;border-color:#555;color:#fff;font-weight:700}
.pp-tools label{margin-left:auto;display:flex;align-items:center;gap:4px;cursor:pointer}
.pp-item.selected{border-color:#2563eb;box-shadow:0 0 0 2px #2563eb}
.pp-item.used{opacity:.45}
.pp-item .pp-check{position:absolute;top:5px;left:5px;min-width:24px;height:24px;border-radius:12px;background:#2563eb;color:#fff;font-size:12px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.pp-item.selected .pp-check{display:flex}
.pp-item .pp-used-badge{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:2px 6px;border-radius:8px}
.pp-item .pp-zoom{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pp-item .pp-zoom:hover{background:rgba(27,58,107,.95)}
.pp-footer{display:none;border-top:1px solid #eee;padding:10px 16px;align-items:center;gap:10px;background:#f8fafc}
.pp-footer.show{display:flex}
.pp-footer .pp-count{font-size:13px;font-weight:700;color:#1B3A6B;margin-right:auto}
.pp-footer button{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1.5px solid #1B3A6B;background:#fff;color:#1B3A6B}
.pp-footer button.primary{background:#1B3A6B;color:#fff}
.pp-footer button:disabled{opacity:.45;cursor:default}
.pp-preview{display:none;position:absolute;inset:0;background:#0f172a;z-index:20;flex-direction:column;border-radius:12px}
.pp-preview.show{display:flex}
.pp-pv-top{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;font-size:12px}
.pp-pv-top .pp-pv-info{margin-right:auto;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-pv-top button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.pp-pv-main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:0 56px}
.pp-pv-main img{max-width:100%;max-height:100%;object-fit:contain;background:#000}
.pp-pv-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer}
.pp-pv-nav:hover{background:rgba(255,255,255,.35)}
.pp-pv-nav.prev{left:6px}.pp-pv-nav.next{right:6px}
.pp-pv-nav:disabled{opacity:.25;cursor:default}
.pp-pv-bottom{display:flex;justify-content:center;gap:10px;padding:12px}
.pp-pv-bottom button{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;background:#fff;color:#1B3A6B}
.pp-pv-bottom button.on{background:#2563eb;color:#fff}

/* 表の線は各マスの4辺の枠を1pxずつ重ねて描く(片側だけの線はPDFで「塗り」になり、Acrobat等で太さがばらついて見えるため) */
.info-cell{display:flex;flex-direction:column;margin:-1px -1px -1px 0}
.info-cell .info-row:last-child{flex:1;align-items:stretch}
.info-cell .info-row:last-child .info-label{align-items:flex-start;padding-top:6px}
.info-row{display:grid;grid-template-columns:22mm 1fr;border:1px solid #333;min-height:9mm;position:relative}
.info-row::before{content:"";position:absolute;top:-1px;bottom:-1px;left:-1px;width:calc(22mm + 1px);border:1px solid #333;pointer-events:none}
.info-row+.info-row{margin-top:-1px}
.info-label{background:#f0f0f0;padding:4px 6px;font-size:11px;font-weight:700;display:flex;align-items:center}
.info-val{padding:2px}
.info-val input{width:100%;height:100%;border:none;padding:4px 6px;font-size:12px;font-family:inherit;background:transparent;color:#1a1a1a;font-weight:700;-webkit-appearance:none;appearance:none}
.info-val input:focus{outline:none;background:#fffbe6}
.info-comment{flex:1;display:flex}
.info-comment textarea{width:100%;border:none;padding:5px 7px;font-size:12px;font-family:inherit;resize:none;line-height:1.6;color:#1a1a1a;font-weight:700;-webkit-appearance:none;appearance:none}
.info-comment textarea:focus{outline:none;background:#fffbe6}
.page-num{position:absolute;bottom:8mm;right:12mm;font-size:11px;color:#666}
.page-del-btn{position:absolute;top:8px;right:8px;padding:4px 10px;background:#fee;color:#ef4444;border:1px solid #fca5a5;border-radius:6px;font-size:11px;cursor:pointer;z-index:10}

@media print{
  body{background:#fff}
  .toolbar,.header-form,.no-print,.page-del-btn{display:none!important}
  .pages{padding:0}
  .page{box-shadow:none;margin:0;page-break-after:always}
  .page:last-child{page-break-after:auto}
  .photo-del,.photo-rotate,.photo-move,.photo-board,.photo-save{display:none!important}
  .photo-cell .ph-placeholder{display:none}
  .info-val input,.info-comment textarea{background:transparent!important}
  /* 背景色(印刷時は白の塗りになる)や写真が枠線に接して上から描かれ、ビューア/プリンターによって罫線が消えるのを防ぐ */
  .photo-cell,.info-label{background:none!important}
  .photo-cell{padding:0.8mm}
  @page{size:A4 portrait;margin:0}
}
</style>
</head>
<body>

<div class="toolbar">
  <h1>📷 工事写真台帳</h1>
  <div class="toolbar-actions">
    <button class="tb-btn ghost" onclick="location.href='genba.html'">🏗️ 現場情報</button>
    <button class="tb-btn ghost" onclick="location.href='index.html'">📋 日報</button>
    <button class="tb-btn ghost" onclick="addPage()">＋ 写真ページ追加</button>
    <button class="tb-btn ghost" onclick="openAlbumList()">📂 アルバム一覧</button>
    <button class="tb-btn ghost" onclick="saveBoardPhotosZip(event)">🪧 黒板写真をJPEG保存</button>
    <button class="tb-btn green" onclick="saveData()">💾 保存</button>
    <button class="tb-btn orange" onclick="exportExcel()">📊 Excel出力</button>
    <button class="tb-btn primary" onclick="window.print()">🖨️ 印刷・PDF</button>
  </div>
</div>

<div class="header-form no-print">
  <div class="hf-title">
    <span>📋 台帳の基本情報（表紙に反映）</span>
    <div class="site-search-wrap">
      <input type="text" class="site-select" id="site-search" placeholder="🔍 現場名で検索…" autocomplete="off" oninput="onSiteSearchInput(this.value)" onfocus="onSiteSearchInput(this.value)">
      <div class="site-search-results" id="site-search-results"></div>
    </div>
    <span class="completed-link" onclick="openCompletedPicker()">📁 完了現場から探す</span>
  </div>
  <div class="hf-grid">
    <div class="hf-field"><label>工事名</label><input type="text" id="h-koji" placeholder="○○マンション防水工事" oninput="syncHeader()"></div>
    <div class="hf-field"><label>現場名</label><input type="text" id="h-genba" placeholder="○○マンション" oninput="syncHeader()"></div>
    <div class="hf-field"><label>所在地</label><input type="text" id="h-addr" placeholder="大阪市○○区○○1-2-3" oninput="syncHeader()"></div>
    <div class="hf-field"><label>施工業者</label><input type="text" id="h-gyosha" placeholder="○○建設株式会社" oninput="syncHeader()"></div>
  </div>
</div>

<div class="pages" id="pages"></div>

<div class="pp-modal no-print" id="photo-picker-modal">
  <div class="pp-modal-inner">
    <div class="pp-modal-header">
      <span>📂 現場の写真から選ぶ</span>
      <span style="display:flex;align-items:center;gap:12px">
        <span class="completed-link" onclick="refreshPhotoPicker()" style="margin-left:0">🔄 更新</span>
        <button onclick="closePhotoPicker()">✕</button>
      </span>
    </div>
    <div class="pp-modal-body">
      <div class="pp-folder-bar" id="pp-folder-bar"></div>
      <div class="pp-tools" id="pp-tools"></div>
      <div class="pp-grid" id="pp-grid"></div>
    </div>
    <div class="pp-footer" id="pp-footer"></div>
    <div class="pp-preview" id="pp-preview" onclick="if(event.target===this)closePickerPreview()"></div>
  </div>
</div>

<div class="pp-modal no-print" id="completed-picker-modal">
  <div class="pp-modal-inner">
    <div class="pp-modal-header">
      <span>📁 完了現場から探す</span>
      <button onclick="closeCompletedPicker()">✕</button>
    </div>
    <div class="pp-modal-body" id="completed-picker-body" style="padding:0"></div>

</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycby9b1XxHyum6h_k50ki3kFLDrauDAEXPXAq5GwzSXcr61A9DpvRlf5q3nLCYSYlO9_j/exec';
const PHOTOS_PER_PAGE = 3;
let pageCount = 0;
let header = { koji:'', genba:'', addr:'', gyosha:'' };
let photoData = {};
let photoSrc = {}; // 枠 -> 元のDrive写真ID(「現場の写真から選ぶ」で入れた写真。回転後も元の写真として取り込み済み判定に使う)
let photoOrig = {};  // 枠 -> 黒板を付ける前の写真(黒板の作り直し・取り外し用)
let photoBoard = {}; // 枠 -> 黒板の内容 {koji,kosyu,bui,date,sekou,pos,size}
let photoDate = {};  // 枠 -> 撮影日(YYYY-MM-DD)
let pickerTargetKey = null;
let pickerPhotosCache = null;
let pickerSelected = []; // ピッカーで選んだ写真(選んだ順)
let pickerShowUsed = false; // 取り込み済みの写真も一覧に出すか
let pickerSize = (()=>{ try{ return localStorage.getItem('pickerSize')||'m'; }catch(e){ return 'm'; } })(); // 一覧の写真の大きさ s/m/l

function $(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}

// 現場リスト読み込み（Google Driveの「工事写真アルバム」フォルダから取得。完了現場も含む）
function loadSiteList(){
const cached = JSON.parse(localStorage.getItem('album-sites-all')||'[]');
window._sites = cached;
autoSelectFromUrl();
fetch(GAS_URL + '?action=getAlbumSites')
.then(r=>r.json())
.then(res=>{
if(res.sites){
localStorage.setItem('album-sites-all', JSON.stringify(res.sites));
window._sites = res.sites;
autoSelectFromUrl();
}
}).catch(()=>{});
}
function autoSelectFromUrl(){
const params = new URLSearchParams(location.search);
const siteName = params.get('site');
if(siteName && !$('h-koji').value){
const idx = (window._sites||[]).findIndex(s=>s.name===siteName);
if(idx>=0){ $('site-search').value = siteName; applySite(idx); }
}
}
function onSiteSearchInput(q){
const box = $('site-search-results');
const query = (q||'').trim();
const sites = window._sites || [];
const matched = query ? sites.filter(s => s.name && s.name.indexOf(query) !== -1) : sites.filter(s => !s.completed);
const list = matched.slice(0, 30);
if(!list.length){
box.innerHTML = '<div class="site-search-empty">該当する現場がありません</div>';
} else {
box.innerHTML = list.map(s=>{
const realIdx = sites.indexOf(s);
const badge = s.completed ? '<span class="ssi-badge">完了</span>' : '';
return '<div class="site-search-item" onmousedown="selectSiteFromSearch(' + realIdx + ')"><span>' + esc(s.name) + '</span>' + badge + '</div>';
}).join('');
}
box.classList.add('show');
}
function selectSiteFromSearch(idx){
const s = (window._sites||[])[idx];
if(!s) return;
$('site-search').value = s.name;
$('site-search-results').classList.remove('show');
applySite(idx);
}
function applySite(idx){
const s = (window._sites||[])[idx];
if(!s) return;
$('h-koji').value = s.name||'';
$('h-genba').value = s.name||'';
syncHeader();
}
document.addEventListener('click', function(e){
const wrap = document.querySelector('.site-search-wrap');
if(wrap && !wrap.contains(e.target)) $('site-search-results').classList.remove('show');
});

// 完了現場ピッカー（年→現場名の2段階選択）
function openCompletedPicker(){
  $('completed-picker-modal').classList.add('show');
  renderCompletedYears();
}
function closeCompletedPicker(){
  $('completed-picker-modal').classList.remove('show');
}
function renderCompletedYears(){
  const body = $('completed-picker-body');
  const years = Array.from(new Set((window._sites||[]).filter(s=>s.completed && s.year).map(s=>s.year))).sort().reverse();
  if(!years.length){
    body.innerHTML = '<div class="pp-empty">完了現場はまだありません</div>';
    return;
  }
  body.innerHTML = years.map(y=>
    '<div class="cp-year-item" onclick="renderCompletedSites(\''+esc(y)+'\')">📅 '+esc(y)+'年</div>'
  ).join('');
}
function renderCompletedSites(year){
  const body = $('completed-picker-body');
  const sites = window._sites||[];
  const list = sites.filter(s=>s.completed && s.year===year);
  const backBtn = '<div class="cp-back" onclick="renderCompletedYears()">← 年を選び直す</div>';
  if(!list.length){
    body.innerHTML = backBtn + '<div class="pp-empty">この年の現場はありません</div>';
    return;
  }
  body.innerHTML = backBtn + list.map(s=>{
    const idx = sites.indexOf(s);
    return '<div class="cp-site-item" onclick="selectSiteFromSearch('+idx+');closeCompletedPicker();">'+esc(s.name)+'</div>';
  }).join('');
}

// 保存済み写真台帳の一覧（写真台帳フォルダに台帳データ.jsonがある現場のみ）
// 開くたびにサーバーから取り直す(保存直後の台帳も必ず出るように)。前回の一覧は取得中の仮表示に使う
function openAlbumList(){
  $('album-list-modal').classList.add('show');
  let cached = [];
  try{ cached = JSON.parse(localStorage.getItem('album-list')||'[]'); }catch(e){}
  renderAlbumList(cached, true);
  fetch(GAS_URL + '?action=listAlbums')
    .then(r=>r.json())
    .then(res=>{
      if(res.status!=='ok') throw new Error(res.message||'');
      try{ localStorage.setItem('album-list', JSON.stringify(res.albums)); }catch(e){}
      if($('album-list-modal').classList.contains('show')) renderAlbumList(res.albums, false);
    })
    .catch(()=>{
      if($('album-list-modal').classList.contains('show')) $('album-list-body').innerHTML = '<div class="pp-empty">⚠️ 一覧の取得に失敗しました。通信状態を確認して、もう一度開いてください</div>';
    });
}
function closeAlbumList(){
  $('album-list-modal').classList.remove('show');
}
function renderAlbumList(list, loading){
  const body = $('album-list-body');
  const note = loading ? '<div class="pp-note" style="padding:0 0 8px">⏳ 最新の一覧を読み込み中...</div>' : '';
  if(!list.length){
    body.innerHTML = note + (loading ? '' : '<div class="pp-empty">保存済みの写真台帳はまだありません<br>（「💾 保存」で現場名を入力して保存すると、ここに表示されます）</div>');
    return;
  }
  body.innerHTML = note + list.map(s=>{
    const upd = s.updated ? '<span style="font-size:11px;color:#888">'+esc(s.updated)+'</span>' : '';
    return '<div class="cp-site-item" style="display:flex;justify-content:space-between;align-items:center" data-site="'+esc(s.name)+'" onclick="openAlbumForSite(this.dataset.site)"><span>'+esc(s.name)+'</span>'+upd+'</div>';
  }).join('');
}
function openAlbumForSite(siteName){
  if(!confirm('「'+siteName+'」の保存済み台帳を開きます。\n現在編集中の内容は破棄されますが、よろしいですか？')) return;
  const body = $('album-list-body');
  const before = body.innerHTML;
  body.innerHTML = '<div class="pp-empty">読み込み中...</div>';
  fetch(GAS_URL + '?action=loadAlbum&site=' + encodeURIComponent(siteName))
    .then(r=>r.json())
    .then(res=>{
      if(res.status!=='ok' || !res.album){
        alert('⚠️ 台帳データの読み込みに失敗しました');
        body.innerHTML = before;
        return;
      }
      restoreAlbum(res.album);
      $('site-search').value = siteName;
      closeAlbumList();
    })
    .catch(()=>{
      alert('⚠️ 通信エラーのため読み込みに失敗しました');
      body.innerHTML = before;
    });
}

function buildCover(){
  return `
    <div class="page cover" id="cover-page">
      <div class="cover-inner">
        <div class="cover-title">工事写真台帳</div>
        <div class="cover-spacer"></div>
        <div class="cover-meta">
          <div class="cm-row"><div class="cm-label">工 事 名</div><div class="cm-val hv-koji"></div></div>
          <div class="cm-row"><div class="cm-label">所 在 地</div><div class="cm-val hv-addr"></div></div>
          <div class="cm-row"><div class="cm-label">施工業者</div><div class="cm-val hv-gyosha"></div></div>
        </div>
      </div>
    </div>`;
}

// 写真ページ
function buildPhotoPage(pageIdx){
  let rows='';
  for(let i=0;i<PHOTOS_PER_PAGE;i++){
    const key = `p${pageIdx}-${i}`;
    rows += `
      <div class="photo-row">
        <div class="photo-cell" id="cell-${key}"
          ondragover="onCellDragOver(event,'${key}')"
          ondragleave="onCellDragLeave('${key}')"
          ondrop="onCellDrop(event,'${key}')">
          ${photoData[key]
            ? photoFilledHtml(key, photoData[key])
            : photoEmptyHtml(key)}
        </div>
        <div class="info-cell">
          <div class="info-row"><div class="info-label">工種</div><div class="info-val"><input type="text" data-k="${key}-kosyu"></div></div>
          <div class="info-row"><div class="info-label">撮影場所</div><div class="info-val"><input type="text" data-k="${key}-place"></div></div>
          <div class="info-row"><div class="info-label">施工内容</div><div class="info-comment"><textarea data-k="${key}-comment"></textarea></div></div>
        </div>
      </div>`;
  }
  return `
    <div class="page" id="page-${pageIdx}" data-photopage="${pageIdx}">
      <button class="page-del-btn no-print" onclick="delPage(${pageIdx})">✕ このページを削除</button>
      <div class="photo-rows">${rows}</div>
      <div class="page-num">- ${pageIdx+2} -</div>
    </div>`;
}

function initCover(){
  const div=document.createElement('div');
  div.innerHTML=buildCover();
  $('pages').appendChild(div.firstElementChild);
}

function addPage(){
  const div=document.createElement('div');
  div.innerHTML=buildPhotoPage(pageCount);
  $('pages').appendChild(div.firstElementChild);
  pageCount++;
  syncHeader();
}

function delPage(idx){
  if(!confirm('このページを削除しますか？'))return;
  const page=$('page-'+idx);
  if(page) page.remove();
  // 写真データも削除
  for(let i=0;i<PHOTOS_PER_PAGE;i++){ clearPhotoState(`p${idx}-${i}`); }
}

function loadPhoto(key,inp){
  const f=inp.files[0];if(!f)return;
  setPhoto(key,f);
}
function photoFilledHtml(key, src){
  return `<img src="${src}"><button class="photo-del" onclick="delPhoto('${key}')">✕</button><button class="photo-rotate" onclick="event.stopPropagation();rotatePhoto('${key}')" title="90度回転">↻</button><button type="button" class="photo-board${photoBoard[key]?' on':''}" onclick="event.stopPropagation();openBoard('${key}')" title="黒板を付ける・直す">🪧 ${photoBoard[key]?'黒板✓':'黒板'}</button>${photoBoard[key]?`<button type="button" class="photo-save" onclick="event.stopPropagation();saveBoardPhoto('${key}')" title="この写真をJPEGで保存・送信">⬇ JPEG</button>`:''}<input type="file" accept="image/*" onchange="loadPhoto('${key}',this)">`
    + `<div class="photo-move"><button type="button" onclick="event.stopPropagation();moveStep('${key}',-1)" title="1つ前へ移動">▲</button><span class="photo-drag" draggable="true" onclick="event.stopPropagation();startMoveMode('${key}')" ondragstart="onPhotoDragStart(event,'${key}')" ondragend="onPhotoDragEnd()" title="クリックして移動先の枠をクリック、またはつかんで移動先の枠へドロップ">⇅ 移動</span><button type="button" onclick="event.stopPropagation();moveStep('${key}',1)" title="1つ後へ移動">▼</button></div>`;
}
function renderCell(key){
  const cell=$('cell-'+key);
  if(cell) cell.innerHTML = photoData[key] ? photoFilledHtml(key, photoData[key]) : photoEmptyHtml(key);
}

// ── 写真の並べ替え ──
// 写真と、その写真の工種・撮影場所・施工内容を1セットとして移動する。
// 並び順は画面上のページ順(削除したページは飛ばす)×ページ内の上から順。
function slotKeys(){
  const keys=[];
  document.querySelectorAll('[data-photopage]').forEach(page=>{
    for(let i=0;i<PHOTOS_PER_PAGE;i++) keys.push(`p${page.dataset.photopage}-${i}`);
  });
  return keys;
}
function readSlot(key){
  const s={photo:photoData[key]||'', src:photoSrc[key]||'', orig:photoOrig[key]||'', board:photoBoard[key]||null, date:photoDate[key]||''};
  ['kosyu','place','comment'].forEach(k=>{const el=document.querySelector(`[data-k="${key}-${k}"]`);s[k]=el?el.value:'';});
  return s;
}
function writeSlot(key,s){
  if(s.photo) photoData[key]=s.photo; else delete photoData[key];
  if(s.src) photoSrc[key]=s.src; else delete photoSrc[key];
  if(s.orig) photoOrig[key]=s.orig; else delete photoOrig[key];
  if(s.board) photoBoard[key]=s.board; else delete photoBoard[key];
  if(s.date) photoDate[key]=s.date; else delete photoDate[key];
  ['kosyu','place','comment'].forEach(k=>{const el=document.querySelector(`[data-k="${key}-${k}"]`);if(el) el.value=s[k]||'';});
  renderCell(key);
}
// fromKeyの写真をtoKeyの位置へ移動する(間の写真は1つずつずれる)
function moveSlot(fromKey,toKey){
  const keys=slotKeys();
  const from=keys.indexOf(fromKey), to=keys.indexOf(toKey);
  if(from<0||to<0||from===to) return;
  const slots=keys.map(readSlot);
  const [moving]=slots.splice(from,1);
  slots.splice(to,0,moving);
  const lo=Math.min(from,to), hi=Math.max(from,to);
  for(let i=lo;i<=hi;i++) writeSlot(keys[i],slots[i]);
  const cell=$('cell-'+toKey);
  if(cell){
    cell.classList.add('just-moved');
    setTimeout(()=>cell.classList.remove('just-moved'),900);
    if(cell.getBoundingClientRect().top<60||cell.getBoundingClientRect().bottom>innerHeight) cell.scrollIntoView({block:'center',behavior:'smooth'});
  }
}
function moveStep(key,dir){
  const keys=slotKeys();
  const i=keys.indexOf(key)+dir;
  if(i<0){alert('これより前には移動できません');return;}
  if(i>=keys.length){alert('これより後に移動するには、先に「＋ 写真ページ追加」でページを増やしてください');return;}
  moveSlot(key,keys[i]);
}
let draggingKey=null;
function onPhotoDragStart(e,key){
  draggingKey=key;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('application/x-photo-key',key); // text/plainだと入力欄にドロップされたとき文字として入ってしまうため独自の形式にする
  e.stopPropagation();
}
function onPhotoDragEnd(){
  draggingKey=null;
  dragScrollSpeed=0;
  document.querySelectorAll('.photo-cell.drag-over').forEach(c=>c.classList.remove('drag-over'));
}
// ドラッグ中に画面の上端・下端へ近づけたら自動でスクロールする(画面外の枠へも運べるように)
let dragScrollSpeed=0, dragScrollTimer=null;
document.addEventListener('dragover',e=>{
  if(!draggingKey) return;
  const topEdge=(document.querySelector('.toolbar')?.getBoundingClientRect().bottom||0)+80;
  const bottomEdge=innerHeight-80;
  if(e.clientY<topEdge) dragScrollSpeed=-Math.min(40,Math.ceil((topEdge-e.clientY)/3)+4);
  else if(e.clientY>bottomEdge) dragScrollSpeed=Math.min(40,Math.ceil((e.clientY-bottomEdge)/3)+4);
  else dragScrollSpeed=0;
  if(dragScrollSpeed && !dragScrollTimer){
    dragScrollTimer=setInterval(()=>{
      if(!dragScrollSpeed||!draggingKey){clearInterval(dragScrollTimer);dragScrollTimer=null;return;}
      scrollBy(0,dragScrollSpeed);
    },16);
  }
});
document.addEventListener('drop',()=>{dragScrollSpeed=0;});

// クリックで移動: 「⇅ 移動」をクリック → 自由にスクロールして移動先の枠をクリック(Escか取消ボタンでやめる)
let moveModeKey=null;
function startMoveMode(key){
  if(moveModeKey===key){ endMoveMode(); return; }
  endMoveMode();
  moveModeKey=key;
  document.body.classList.add('move-mode');
  $('cell-'+key)?.classList.add('move-source');
  const bar=document.createElement('div');
  bar.id='move-mode-bar';
  bar.className='no-print';
  bar.innerHTML='⇅ 移動先の写真の枠をクリックしてください（スクロールして別のページへも移動できます）<button type="button" onclick="endMoveMode()">取消</button>';
  document.body.appendChild(bar);
}
function endMoveMode(){
  if(moveModeKey) $('cell-'+moveModeKey)?.classList.remove('move-source');
  moveModeKey=null;
  document.body.classList.remove('move-mode');
  $('move-mode-bar')?.remove();
}
// 移動モード中の枠のクリックは、写真の取り込み・削除などより優先して移動先の指定として扱う
document.addEventListener('click',e=>{
  if(!moveModeKey) return;
  if(e.target.closest('#move-mode-bar')) return;
  const cell=e.target.closest('.photo-cell');
  if(!cell) return;
  e.preventDefault(); e.stopPropagation();
  const from=moveModeKey, to=cell.id.replace(/^cell-/,'');
  endMoveMode();
  if(from!==to) moveSlot(from,to);
},true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&moveModeKey) endMoveMode(); });
function photoEmptyHtml(key){
  return `<div class="ph-placeholder"><div class="ph-icon">📷</div>クリック または<br>ドラッグ＆ドロップ<br><button type="button" class="ph-pick-btn" onclick="event.stopPropagation();openPhotoPicker('${key}')">📂 現場の写真から選ぶ</button></div><input type="file" accept="image/*" onchange="loadPhoto('${key}',this)">`;
}
// ✕ボタンで写真を削除し、そのマス目を未選択の状態(クリック/ドラッグ&ドロップで
// 再度写真を追加できる状態)に戻す。
function clearPhotoState(key){
  delete photoData[key]; delete photoSrc[key];
  delete photoOrig[key]; delete photoBoard[key]; delete photoDate[key];
}
function delPhoto(key){
  clearPhotoState(key);
  const cell=$('cell-'+key);
  if(cell) cell.innerHTML=photoEmptyHtml(key);
}
function setPhoto(key,file){
  if(!file||!file.type.startsWith('image/')){alert('⚠️ 画像ファイルを選択してください');return;}
  const r=new FileReader();
  r.onload=e=>{
    clearPhotoState(key);
    photoData[key]=e.target.result;
    if(file.lastModified) photoDate[key]=ymd(new Date(file.lastModified));
    $('cell-'+key).innerHTML=photoFilledHtml(key, e.target.result);
  };
  r.readAsDataURL(file);
}
function rotatePhoto(key){
  const src = photoData[key];
  if(!src) return;
  if(photoBoard[key]){ alert('⚠️ 黒板付きの写真は回転できません。\n「🪧 黒板✓」→「黒板を外す」で外してから回転し、もう一度黒板を付けてください。'); return; }

  // Google Drive由来の写真はCORS制限で直接canvasに描画できないため、
  // GAS経由で実データ(base64)を取得してから回転する
  const driveMatch = /^https:\/\/drive\.google\.com\/thumbnail\?id=([^&]+)/.exec(src);
  if(driveMatch){
    const cell = $('cell-'+key);
    const before = cell.innerHTML;
    cell.innerHTML = '<div class="ph-placeholder">回転中…</div>';
    fetch(GAS_URL + '?action=getPhotoData&id=' + encodeURIComponent(driveMatch[1]))
      .then(r=>r.json())
      .then(res=>{
        if(res.status!=='ok' || !res.dataUrl){
          cell.innerHTML = before;
          alert('⚠️ 写真データの取得に失敗し、回転できませんでした');
          return;
        }
        photoSrc[key] = driveMatch[1];
        doRotate(key, res.dataUrl);
      })
      .catch(()=>{
        cell.innerHTML = before;
        alert('⚠️ 写真データの取得に失敗し、回転できませんでした');
      });
    return;
  }

  doRotate(key, src);
}
function doRotate(key, src){
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalHeight;
    canvas.height = img.naturalWidth;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(90 * Math.PI/180);
    ctx.drawImage(img, -img.naturalWidth/2, -img.naturalHeight/2);
    const rotated = canvas.toDataURL('image/jpeg', 0.9);
    photoData[key] = rotated;
    $('cell-'+key).innerHTML = photoFilledHtml(key, rotated);
  };
  img.onerror = () => {
    alert('⚠️ 画像の読み込みに失敗し、回転できませんでした');
  };
  img.src = src;
}


// ══════════ 黒板 ══════════
// 写真の隅に黒板(工事名/工種/部位/撮影日/施工者)を描き込んだ画像を作り、その枠の写真として置き換える。
// 元の写真は photoOrig に残すので、何度でも作り直し・取り外しができる。
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function boardDateText(v){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');
  return m ? `${m[1]}年${+m[2]}月${+m[3]}日` : (v||'');
}
const BOARD_POS = [['bl','左下'],['br','右下'],['tl','左上'],['tr','右上']];
const BOARD_SIZE = [['s','小'],['m','中'],['l','大']];
let boardKey = null, boardImg = null, boardBusy = false;

let boardSize = (()=>{ try{ return localStorage.getItem('boardSize')||'m'; }catch(e){ return 'm'; } })();

// 写真(DriveのURL/画像データ)を canvas に描ける Image として読み込む
function loadBoardImage(src){
  return new Promise((resolve,reject)=>{
    const done = dataUrl=>{ const img=new Image(); img.onload=()=>resolve(img); img.onerror=()=>reject(new Error('画像の読み込みに失敗しました')); img.src=dataUrl; };
    const m = /^https:\/\/drive\.google\.com\/thumbnail\?id=([^&]+)/.exec(src||'');
    if(m){
      // Drive の写真はCORS制限で直接描けないため、GAS経由で画像データを取得する(回転と同じ方法)
      fetch(GAS_URL + '?action=getPhotoData&id=' + encodeURIComponent(m[1]))
        .then(r=>r.json())
        .then(res=>{ if(res.status==='ok' && res.dataUrl) done(res.dataUrl); else reject(new Error('写真データの取得に失敗しました')); })
        .catch(()=>reject(new Error('通信エラーで写真データを取得できませんでした')));
    }else if(src){ done(src); }
    else reject(new Error('写真がありません'));
  });
}
// 黒板を付ける前の元写真。無ければ null(黒板付きの画像しか残っていない)
function boardOriginal(key){

  if(photoBoard[key]) return null;
  return photoData[key] || null;
}

// 黒板を描く。W,H=写真の大きさ
function drawBoard(ctx, W, H, v, pos, size){
  const f = {s:.24, m:.30, l:.38}[size] || .30;
  const bw = Math.round(Math.min(W*0.62, Math.max(W,H)*f));
  const rowH = bw*0.13;
  // [見出し, 内容, 行の高さ(倍)]。作業内容は大きめの欄にして複数行で書けるようにする
  const rows = [['工事名',v.koji,1],['工　種',v.kosyu,1],['部　位',v.bui,1],['作業内容',v.naiyo,2.6],['撮影日',boardDateText(v.date),1],['施工者',v.sekou,1]];
  const bh = Math.round(rowH*rows.reduce((t,r)=>t+r[2],0));
  const mg = Math.round(Math.min(W,H)*0.02);
  const x = pos[1]==='r' ? W-bw-mg : mg;
  const y = pos[0]==='b' ? H-bh-mg : mg;
  const lw = Math.max(1, bw*0.006), labW = bw*0.24;
  const font = "'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif";
  const setF = fs=>{ ctx.font = `bold ${fs}px ${font}`; };
  // 文字を幅maxWで折り返して行の配列にする(改行も反映)
  const wrap = (text, maxW)=>{
    const out=[];
    String(text||'').split(/\r?\n/).forEach(para=>{
      let line='';
      for(const ch of para){
        if(line && ctx.measureText(line+ch).width > maxW){ out.push(line); line=ch; } else line+=ch;
      }
      out.push(line);
    });
    return out;
  };
  ctx.save();
  ctx.fillStyle = '#245c3b';
  ctx.fillRect(x, y, bw, bh);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = lw*2;
  ctx.strokeRect(x+lw, y+lw, bw-lw*2, bh-lw*2);
  ctx.lineWidth = lw;
  ctx.beginPath();
  let yy = y;
  rows.forEach((r,i)=>{ if(i){ ctx.moveTo(x, yy); ctx.lineTo(x+bw, yy); } yy += rowH*r[2]; });
  ctx.moveTo(x+labW, y); ctx.lineTo(x+labW, y+bh);
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.textBaseline = 'middle';
  const maxW = bw - labW - rowH*0.5, tx = x+labW+rowH*0.25;
  yy = y;
  rows.forEach(([lab,val,hMul])=>{
    const h = rowH*hMul, cy = yy + h/2;
    // 見出し(4文字の見出しは2行に)
    let fs = rowH*0.46; setF(fs); ctx.textAlign = 'center';
    if(lab.length>=4 && hMul>1){ const hl=lab.length/2; ctx.fillText(lab.slice(0,hl), x+labW/2, cy-fs*0.6); ctx.fillText(lab.slice(hl), x+labW/2, cy+fs*0.6); }
    else { while(fs>rowH*0.3 && ctx.measureText(lab).width>labW*0.9){ fs*=0.94; setF(fs); } ctx.fillText(lab, x+labW/2, cy); }
    ctx.textAlign = 'left';
    const text = String(val||'');
    yy += h;
    if(!text) return;
    // 収まる最大の文字サイズで、欄の高さに入るだけ折り返す
    let lines;
    if(hMul===1){
      // 1行欄：まず1行で。長すぎる時は同じ長さの2行に分ける
      const t = text.replace(/\r?\n/g,' ');
      fs = rowH*0.5; setF(fs);
      while(fs > rowH*0.42 && ctx.measureText(t).width > maxW){ fs*=0.94; setF(fs); }
      if(ctx.measureText(t).width <= maxW) lines=[t];
      else{
        const hl=Math.ceil(t.length/2); lines=[t.slice(0,hl), t.slice(hl)];
        fs = rowH*0.36; setF(fs);
        while(fs > rowH*0.18 && Math.max(ctx.measureText(lines[0]).width, ctx.measureText(lines[1]).width) > maxW){ fs*=0.94; setF(fs); }
      }
    }else{
      fs = rowH*0.5;
      while(true){
        setF(fs); lines = wrap(text, maxW);
        if(lines.length*fs*1.15 <= h*0.85 || fs <= rowH*0.18) break;
        fs *= 0.94;
      }
    }
    const lh = fs*1.15, top = (hMul>1 ? yy-h + rowH*0.2 + lh/2 : cy - (lines.length-1)*lh/2);
    lines.forEach((ln,i)=>ctx.fillText(ln, tx, top + i*lh, maxW));
  });
  ctx.restore();
}
// 写真+黒板 → 画像データ(JPEG)。長辺は最大2000pxに縮小して保存容量を抑える
function composeBoard(img, v, pos, size, maxSide){
  const s = Math.min(1, (maxSide||2000) / Math.max(img.naturalWidth, img.naturalHeight));
  const W = Math.round(img.naturalWidth*s), H = Math.round(img.naturalHeight*s);
  const c = document.createElement('canvas'); c.width=W; c.height=H;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, W, H);
  drawBoard(ctx, W, H, v, pos, size);
  return c;
}

function slotVal(key,k){ const el=document.querySelector(`[data-k="${key}-${k}"]`); return el?el.value:''; }
function boardFormValues(){
  return { koji:$('bd-koji').value, kosyu:$('bd-kosyu').value, bui:$('bd-bui').value, naiyo:$('bd-naiyo').value, date:$('bd-date').value, sekou:$('bd-sekou').value };
}
function renderBoardChips(){

function setBoardOpt(which, v){
  if(which==='pos'){ boardPos=v; try{localStorage.setItem('boardPos',v);}catch(e){} }
  else { boardSize=v; try{localStorage.setItem('boardSize',v);}catch(e){} }

}
function drawBoardPreview(){

function setBoardBusy(on, msg){
  boardBusy = on;
  $('bd-apply').disabled = on || !boardImg;
  $('bd-remove').disabled = on;

}

function openBoard(key){
  if(!photoData[key]) return;
  boardKey = key; boardImg = null;
  const b = photoBoard[key];
  $('bd-koji').value  = b ? b.koji  : header.koji;
  $('bd-kosyu').value = b ? b.kosyu : slotVal(key,'kosyu');
  $('bd-bui').value   = b ? b.bui   : slotVal(key,'place');
  $('bd-naiyo').value = b ? (b.naiyo||'') : slotVal(key,'comment');
  $('bd-date').value  = b ? b.date  : (photoDate[key] || ymd(new Date()));
  $('bd-sekou').value = b ? b.sekou : header.gyosha;
  if(b){ boardPos=b.pos||boardPos; boardSize=b.size||boardSize; }
  $('bd-all').checked = false;

  renderBoardChips();
  const view = $('bd-canvas'); view.width=10; view.height=10;

  let src = boardOriginal(key);
  if(!src){
    // 元の写真が残っていない(端末から取り込んだ写真で、ページを開き直した場合など)
    if(!confirm('この写真の黒板前の元写真が見つかりません。\n今の黒板の上に新しい黒板を重ねて付けますか？\n（元の写真から付け直したい場合は、写真を入れ直してください）')){ closeBoard(); return; }
    src = photoData[key];
  }
  loadBoardImage(src).then(img=>{
    if(boardKey!==key) return;
    boardImg = img;
    $('bd-loading').style.display = 'none';
    setBoardBusy(false, '');
    drawBoardPreview();
  }).catch(err=>{
    if(boardKey!==key) return;
    $('bd-loading').textContent = '⚠️ ' + err.message;
    setBoardBusy(false, '');
    $('bd-apply').disabled = true;
  });
}
function closeBoard(){
  if(boardBusy) return;
  $('board-modal').classList.remove('show');
  boardKey = null; boardImg = null;
}
// 1枚に黒板を付けて枠に反映
function putBoard(key, img, orig, v){
  const c = composeBoard(img, v, boardPos, boardSize, 2000);
  if(!photoOrig[key]) photoOrig[key] = orig;
  photoBoard[key] = Object.assign({}, v, {pos:boardPos, size:boardSize});
  photoData[key] = c.toDataURL('image/jpeg', 0.88);
  renderCell(key);
}
async function applyBoard(){
  if(!boardImg || !boardKey || boardBusy) return;
  const key = boardKey, v = boardFormValues();
  // 工種・部位が台帳側で空欄なら、黒板の内容を台帳にも入れる
  const setIfEmpty = (k,val)=>{ const el=document.querySelector(`[data-k="${key}-${k}"]`); if(el && !el.value && val) el.value=val; };
  setIfEmpty('kosyu', v.kosyu); setIfEmpty('place', v.bui); setIfEmpty('comment', v.naiyo);
  const orig = boardOriginal(key) || photoData[key];

  if(!$('bd-all').checked){
    putBoard(key, boardImg, orig, v);
    boardBusy=false; closeBoard();
    return;
  }

  // すべての写真に付ける
  const keys = slotKeys().filter(k=>photoData[k]);
  let ok=0, skipped=0, failed=0;
  setBoardBusy(true, '');
  for(let i=0;i<keys.length;i++){
    const k = keys[i];
    $('bd-msg').textContent = `黒板を付けています… ${i+1} / ${keys.length}`;
    const vk = k===key ? v : {
      koji: v.koji, sekou: v.sekou,
      kosyu: slotVal(k,'kosyu'), bui: slotVal(k,'place'), naiyo: slotVal(k,'comment'),
      date: (photoBoard[k] && photoBoard[k].date) || photoDate[k] || v.date
    };
    if(k===key){ putBoard(k, boardImg, orig, vk); ok++; continue; }
    const src = boardOriginal(k);
    if(!src){ skipped++; continue; }
    try{ const img = await loadBoardImage(src); putBoard(k, img, src, vk); ok++; }
    catch(e){ failed++; }
  }
  setBoardBusy(false, '');
  closeBoard();
  let msg = `✅ ${ok}枚に黒板を付けました。`;
  if(skipped) msg += `\n・元写真が見つからず飛ばした写真：${skipped}枚（写真を入れ直すと付けられます）`;
  if(failed) msg += `\n・読み込みに失敗した写真：${failed}枚`;
  msg += '\n\n最後に「💾 保存」を押してください。';
  alert(msg);
}
function removeBoard(){
  if(!boardKey || boardBusy) return;
  const key = boardKey;
  const orig = photoOrig[key];
  if(!orig){ alert('⚠️ 元の写真が残っていないため、黒板を外せません。\n写真を入れ直してください。'); return; }
  photoData[key] = orig;
  delete photoOrig[key]; delete photoBoard[key];
  renderCell(key);
  closeBoard();
}

// ══════════ 黒板写真をJPEGで保存・送信 ══════════
function safeName(t){ return String(t||'').replace(/[\\\/:*?"<>|\r\n\t]/g,'').replace(/\s+/g,'_').slice(0,40); }
function boardFileName(key, no){
  const b = photoBoard[key] || {};
  const parts = [String(no).padStart(2,'0'), (b.date||'').replace(/-/g,''), safeName(b.kosyu), safeName(b.bui)].filter(Boolean);
  return parts.join('_') + '.jpg';
}
function dataUrlToBlob(u){
  const [head, b64] = u.split(',');
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:(/data:([^;]+)/.exec(head)||[])[1]||'image/jpeg'});
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
// スマホ(共有機能あり)はLINE・メール等へ直接送れる共有画面を出し、パソコンはダウンロードする
async function shareOrDownload(files){
  const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
  if(isMobile && navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  files.forEach(f=>downloadBlob(f, f.name));
}
function boardKeysInOrder(){ return slotKeys().filter(k=>photoData[k] && photoBoard[k]); }
function saveBoardPhoto(key){
  const src = photoData[key];
  if(!src || !src.startsWith('data:')){ alert('⚠️ この写真はまだ黒板付きの画像になっていません'); return; }
  const no = boardKeysInOrder().indexOf(key) + 1;
  const name = boardFileName(key, no || 1);
  shareOrDownload([new File([dataUrlToBlob(src)], name, {type:'image/jpeg'})]);
}
function loadJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((res,rej)=>{
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    sc.onload=()=>res(window.JSZip); sc.onerror=()=>rej(new Error('ZIP作成の準備に失敗しました（通信を確認してください）'));
    document.head.appendChild(sc);
  });
}
// 黒板付きの写真をまとめて保存。スマホは写真ごとに共有(LINE・メール・写真アプリへ保存)、パソコンはZIP1つにまとめる
async function saveBoardPhotosZip(ev){
  const keys = boardKeysInOrder().filter(k=>String(photoData[k]).startsWith('data:'));
  if(!keys.length){ alert('⚠️ 黒板を付けた写真がありません。\n写真の「🪧 黒板」から先に黒板を付けてください。'); return; }
  const files = keys.map((k,i)=>new File([dataUrlToBlob(photoData[k])], boardFileName(k,i+1), {type:'image/jpeg'}));
  const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
  if(isMobile && navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  const btn = ev && ev.currentTarget; const before = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled=true; btn.innerHTML='⏳ 作成中…'; }
  try{
    const JSZip = await loadJSZip();
    const zip = new JSZip();
    files.forEach(f=>zip.file(f.name, f));
    const blob = await zip.generateAsync({type:'blob'});
    const site = safeName(header.genba || header.koji || '工事写真');
    downloadBlob(blob, `${site}_黒板写真_${ymd(new Date()).replace(/-/g,'')}.zip`);
  }catch(e){
    if(confirm('⚠️ '+e.message+'\nZIPにせず1枚ずつ保存しますか？')) files.forEach(f=>downloadBlob(f,f.name));
  }finally{
    if(btn){ btn.disabled=false; btn.innerHTML=before; }
  }
}

// 現場の写真ピッカー（日報アプリでGoogle Driveに保存済みの写真から選ぶ）

let pickerFoldersCache = {}; // 現場名 -> フォルダ名一覧のキャッシュ
let pickerCurrentFolder = ''; // ''=すべて、'__ROOT__'=未分類、それ以外=フォルダ名
// 並び順: 'asc'=古い順(既定。写真台帳は着工から順に作るため)、'desc'=新しい順。最後に選んだ方をこの端末に記憶する

// 現場のDriveフォルダ内にある作業内容別サブフォルダ(作業日報アプリで作られたもの)の一覧を
// 取得し、フォルダ選択チップとして表示する。サブフォルダが増えると1度に取得できる写真が
// 60件までに絞られる関係で、他フォルダの写真に押し出されて目当ての写真が出てこないことが
// あったため、フォルダを選んでから絞り込んで探せるようにした。
function loadPickerFolders(siteName){
  if(pickerFoldersCache[siteName]){
    renderFolderBar(pickerFoldersCache[siteName]);
    return;
  }
  fetch(GAS_URL + '?action=getSitePhotoFolders&site=' + encodeURIComponent(siteName), {cache:'no-store'})
    .then(r=>r.json())
    .then(res=>{
      pickerFoldersCache[siteName] = (res && res.folders) || [];
      renderFolderBar(pickerFoldersCache[siteName]);
    })
    .catch(()=>{ renderFolderBar([]); });
}
function renderFolderBar(folders){
  const bar = $('pp-folder-bar');
  if(!bar) return;
  const chip = (value, label) => `<button type="button" class="pp-folder-chip${pickerCurrentFolder===value?' active':''}" onclick="selectPickerFolder('${value}')">${label}</button>`;
  const orderChip = (value, label) => `<button type="button" class="pp-order-chip${pickerOrder===value?' active':''}" onclick="selectPickerOrder('${value}')">${label}</button>`;
  bar.innerHTML = chip('', 'すべて') + chip('__ROOT__', '未分類') + folders.map(f=>chip(f, esc(f))).join('')
    + `<span class="pp-order">${orderChip('asc', '古い順')}${orderChip('desc', '新しい順')}</span>`;
}
function selectPickerOrder(order){
  if(pickerOrder === order) return;
  pickerOrder = order;
  try{ localStorage.setItem('pickerOrder', order); }catch(e){}
  const siteName = (header.genba || header.koji || '').trim();
  if(!siteName) return;
  renderFolderBar(pickerFoldersCache[siteName] || []);
  loadSitePhotos(siteName, pickerCurrentFolder);
}
function selectPickerFolder(folder){
  pickerCurrentFolder = folder;
  const siteName = (header.genba || header.koji || '').trim();
  if(!siteName) return;
  renderFolderBar(pickerFoldersCache[siteName] || []);
  loadSitePhotos(siteName, folder);
}
function loadSitePhotos(siteName, folder){
  folder = folder || '';
  const cacheKey = pickerCacheKey(siteName, folder);
  const grid = $('pp-grid');
  if(sitePhotosCache[cacheKey]){
    const cached = sitePhotosCache[cacheKey];
    pickerPhotosCache = cached.photos;
    renderPickerGrid(cached.photos, cached.totalCount);
    return;
  }
  grid.innerHTML = '<div class="pp-empty">読み込み中...</div>';
  let url = GAS_URL + '?action=getSitePhotos&site=' + encodeURIComponent(siteName) + '&order=' + pickerOrder;
  if(folder) url += '&folder=' + encodeURIComponent(folder);
  fetch(url)
    .then(r=>r.json())
    .then(res=>{
      // 読み込み中に並び順やフォルダを切り替えた場合、古い応答で画面を上書きしない
      if(pickerCacheKey(siteName, pickerCurrentFolder) !== cacheKey) return;
      if(res.status!=='ok' || !res.photos || !res.photos.length){
        grid.innerHTML = '<div class="pp-empty">この現場の写真はまだ見つかりませんでした<br>（日報アプリで撮影・保存した写真がここに表示されます）</div>';
        return;
      }
      sitePhotosCache[cacheKey] = {photos: res.photos, totalCount: res.totalCount || res.photos.length};
      pickerPhotosCache = res.photos;
      renderPickerGrid(res.photos, res.totalCount);
    })
    .catch(()=>{
      grid.innerHTML = '<div class="pp-empty">読み込みに失敗しました。通信環境を確認してもう一度お試しください</div>';
    });
}
function refreshPhotoPicker(){
  const siteName = (header.genba || header.koji || '').trim();
  if(!siteName) return;
  delete pickerFoldersCache[siteName];
  delete sitePhotosCache[pickerCacheKey(siteName, pickerCurrentFolder)];
  loadPickerFolders(siteName);
  loadSitePhotos(siteName, pickerCurrentFolder);
}
// 一度に取得するのは60件まで(GAS側getSitePhotosのLIMIT)。それより古い写真は一覧末尾の
// 「さらに読み込む」でoffsetを進めて追加取得する(工期の長い現場で最初の頃の写真も台帳に載せられるように)。
function pickerItemsHtml(photos, startIndex){
  const used = usedPhotoIds();
  return photos.map((p,i)=>{
    const idx = startIndex+i;
    const isUsed = !!used[p.id];
    if(isUsed && !pickerShowUsed) return '';
    const selNo = pickerSelected.findIndex(s=>s.id===p.id);
    return `
    <div class="pp-item${selNo>=0?' selected':''}${isUsed?' used':''}" data-id="${esc(p.id)}" onclick="togglePickerSelect(${idx})">
      <img src="${p.url}" loading="lazy">
      <span class="pp-check">${selNo>=0?selNo+1:''}</span>
      ${isUsed?'<span class="pp-used-badge">取り込み済み</span>':''}
      <button type="button" class="pp-zoom" title="拡大して見る" onclick="event.stopPropagation();openPickerPreview(${idx})">🔍</button>
      ${p.folder?`<div class="pp-folder">${esc(p.folder)}</div>`:''}
    </div>`;
  }).join('');
}
// 台帳に取り込み済みの写真(Drive写真ID)。回転して画像データになった写真も元のIDで数える
function usedPhotoIds(){
  const used = {};
  Object.values(photoData).forEach(v=>{
    const s = String(v);
    if(!s.startsWith('https://drive.google.com/')) return;
    const m = /[?&]id=([^&]+)/.exec(s);
    if(m) used[m[1]] = true;
  });
  Object.values(photoSrc).forEach(id=>{ if(id) used[id]=true; });
  return used;
}
// 今の一覧で表示している写真(取り込み済みを隠しているときはそれを除く)の、pickerPhotosCache上の番号
function pickerVisibleIndexes(){
  const used = usedPhotoIds();
  return (pickerPhotosCache||[]).map((p,i)=>(!used[p.id]||pickerShowUsed)?i:-1).filter(i=>i>=0);
}
function pickerNoteText(shown, totalCount){
  const label = pickerOrder === 'asc' ? '古い順' : '新しい順';
  return (totalCount && totalCount > shown) ? `${label}に${shown}件を表示中（全${totalCount}件）` : '';
}
function pickerMoreHtml(shown, totalCount){
  if(!(totalCount && totalCount > shown)) return '';
  const rest = totalCount - shown;
  const label = pickerOrder === 'asc' ? 'さらに新しい写真を読み込む' : 'さらに古い写真を読み込む';
  return `<button type="button" class="pp-more" id="pp-more" onclick="loadMorePickerPhotos()">${label}（残り${rest}件）</button>`;
}
function renderPickerGrid(photos, totalCount){
  const grid = $('pp-grid');
  grid.className = 'pp-grid size-' + pickerSize;
  const note = pickerNoteText(photos.length, totalCount);
  const items = pickerItemsHtml(photos, 0);
  const used = usedPhotoIds();
  const hidden = pickerShowUsed ? 0 : photos.filter(p=>used[p.id]).length;
  const hiddenNote = hidden ? `<div class="pp-note" id="pp-hidden-note">台帳に取り込み済みの${hidden}枚は表示していません</div>` : '';
  grid.innerHTML = (note ? `<div class="pp-note" id="pp-note">${note}</div>` : '')
    + hiddenNote
    + (items.trim() ? items : '<div class="pp-empty" style="grid-column:1/-1">表示できる写真がありません（すべて取り込み済みです）</div>')
    + pickerMoreHtml(photos.length, totalCount);
}
function rerenderPickerGrid(){
  const siteName = (header.genba || header.koji || '').trim();
  const cached = sitePhotosCache[pickerCacheKey(siteName, pickerCurrentFolder)];
  if(cached) renderPickerGrid(cached.photos, cached.totalCount);
}
// 一覧の上の道具: 写真の大きさ(小/中/大)・取り込み済みも表示
function renderPickerTools(){
  const chip = (v,l)=>`<button type="button" class="pp-size-chip${pickerSize===v?' active':''}" onclick="setPickerSize('${v}')">${l}</button>`;
  $('pp-tools').innerHTML = '写真の大きさ ' + chip('s','小') + chip('m','中') + chip('l','大')
    + `<label><input type="checkbox" ${pickerShowUsed?'checked':''} onchange="pickerShowUsed=this.checked;rerenderPickerGrid()">取り込み済みも表示</label>`;
}
function setPickerSize(v){
  pickerSize = v;
  try{ localStorage.setItem('pickerSize', v); }catch(e){}
  renderPickerTools();
  $('pp-grid').className = 'pp-grid size-' + v;
}
// ── 複数選択 ──
function togglePickerSelect(i){
  const p = pickerPhotosCache && pickerPhotosCache[i];
  if(!p) return;
  const at = pickerSelected.findIndex(s=>s.id===p.id);
  if(at>=0) pickerSelected.splice(at,1); else pickerSelected.push(p);
  refreshPickerSelectionMarks();
}
function refreshPickerSelectionMarks(){
  document.querySelectorAll('#pp-grid .pp-item').forEach(el=>{
    const no = pickerSelected.findIndex(s=>s.id===el.dataset.id);
    el.classList.toggle('selected', no>=0);
    const c = el.querySelector('.pp-check'); if(c) c.textContent = no>=0 ? no+1 : '';
  });
  renderPickerFooter();
  if($('pp-preview').classList.contains('show')) renderPickerPreview();
}
function renderPickerFooter(){
  const n = pickerSelected.length;
  const f = $('pp-footer');
  f.classList.toggle('show', !!pickerTargetKey);
  f.innerHTML = `<span class="pp-count">${n ? n+'枚 選択中（選んだ順に入ります）' : '写真をクリックして選択（複数可）。🔍で拡大表示'}</span>`
    + `<button type="button" onclick="pickerSelected=[];refreshPickerSelectionMarks()" ${n?'':'disabled'}>選択を解除</button>`
    + `<button type="button" class="primary" onclick="importPickerSelection()" ${n?'':'disabled'}>この枠から順に取り込む${n?'（'+n+'枚）':''}</button>`;
}
// 選んだ写真を、ピッカーを開いた枠から順に空いている枠へ入れる(写真が入っている枠は飛ばす。足りなければページを足す)
function importPickerSelection(){
  if(!pickerSelected.length || !pickerTargetKey) return;
  const list = pickerSelected.slice();
  let keys = slotKeys();
  let pos = Math.max(0, keys.indexOf(pickerTargetKey));
  const filled = [];
  for(const p of list){
    while(true){
      if(pos >= keys.length){ addPage(); keys = slotKeys(); }
      if(!photoData[keys[pos]]) break;
      pos++;
    }
    const key = keys[pos++];
    clearPhotoState(key);
    photoData[key] = p.url;
    photoSrc[key] = p.id;
    if(p.dateAdded){ const d=new Date(p.dateAdded); if(!isNaN(d)) photoDate[key]=ymd(d); }
    renderCell(key);
    filled.push(key);
  }
  closePhotoPicker();
  filled.forEach(k=>{ const c=$('cell-'+k); if(c){ c.classList.add('just-moved'); setTimeout(()=>c.classList.remove('just-moved'),1200); } });
  const first = $('cell-'+filled[0]); if(first) first.scrollIntoView({block:'center',behavior:'smooth'});
}
// ── 拡大表示 ──
let pickerPreviewIndex = -1;
function openPickerPreview(i){
  pickerPreviewIndex = i;
  $('pp-preview').classList.add('show');
  renderPickerPreview();
}
function closePickerPreview(){
  $('pp-preview').classList.remove('show');
  pickerPreviewIndex = -1;
}
function renderPickerPreview(){
  const p = pickerPhotosCache && pickerPhotosCache[pickerPreviewIndex];
  if(!p){ closePickerPreview(); return; }
  const vis = pickerVisibleIndexes();
  const at = vis.indexOf(pickerPreviewIndex);
  const selNo = pickerSelected.findIndex(s=>s.id===p.id);
  const big = String(p.url).replace(/sz=w\d+/, 'sz=w1600');
  const d = p.dateAdded ? new Date(p.dateAdded) : null;
  const dateText = d && !isNaN(d) ? `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}` : '';
  const info = [at>=0 ? `${at+1} / ${vis.length}` : '', p.folder||'', dateText].filter(Boolean).map(esc).join('　');
  $('pp-preview').innerHTML = `
    <div class="pp-pv-top"><span class="pp-pv-info">${info}</span><button type="button" onclick="closePickerPreview()" title="閉じる(Esc)">✕</button></div>
    <div class="pp-pv-main">
      <button type="button" class="pp-pv-nav prev" onclick="stepPickerPreview(-1)" ${at>0?'':'disabled'} title="前の写真(←)">‹</button>
      <img src="${big}" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${p.url}'}">
      <button type="button" class="pp-pv-nav next" onclick="stepPickerPreview(1)" ${at>=0&&at<vis.length-1?'':'disabled'} title="次の写真(→)">›</button>
    </div>
    <div class="pp-pv-bottom">
      <button type="button" class="${selNo>=0?'on':''}" onclick="togglePickerSelect(${pickerPreviewIndex})">${selNo>=0?'✓ 選択中（'+(selNo+1)+'番目）— 押すと外す':'この写真を選択する（Space）'}</button>
      <button type="button" onclick="closePickerPreview()">一覧に戻る</button>
    </div>`;
}
function stepPickerPreview(dir){
  const vis = pickerVisibleIndexes();
  const at = vis.indexOf(pickerPreviewIndex);
  const next = vis[at+dir];
  if(next===undefined) return;
  pickerPreviewIndex = next;
  renderPickerPreview();
}
document.addEventListener('keydown',e=>{
  if(!$('pp-preview') || !$('pp-preview').classList.contains('show')) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); stepPickerPreview(-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); stepPickerPreview(1); }
  else if(e.key==='Escape'){ e.preventDefault(); closePickerPreview(); }
  else if(e.key===' '){ e.preventDefault(); togglePickerSelect(pickerPreviewIndex); }
});
function loadMorePickerPhotos(){
  const siteName = (header.genba || header.koji || '').trim();
  const folder = pickerCurrentFolder || '';
  const cacheKey = pickerCacheKey(siteName, folder);
  const cached = sitePhotosCache[cacheKey];
  const btn = $('pp-more');
  if(!siteName || !cached || !btn) return;
  btn.disabled = true;
  btn.textContent = '読み込み中...';
  let url = GAS_URL + '?action=getSitePhotos&site=' + encodeURIComponent(siteName) + '&order=' + pickerOrder + '&offset=' + cached.photos.length;
  if(folder) url += '&folder=' + encodeURIComponent(folder);
  fetch(url)
    .then(r=>r.json())
    .then(res=>{
      if(res.status!=='ok' || !res.photos) throw new Error(res.message || 'error');
      // 読み込みの間に写真が追加されると境目の写真が重複して返ることがあるため、IDで除く
      const seen = {};
      cached.photos.forEach(p=>{ seen[p.id] = true; });
      const added = res.photos.filter(p=>!seen[p.id]);
      const startIndex = cached.photos.length;
      added.forEach(p=>cached.photos.push(p));
      // 途中で写真が削除されて末尾まで届いた場合は、表示済みの件数を全件とみなす
      cached.totalCount = res.photos.length ? (res.totalCount || cached.photos.length) : cached.photos.length;
      // 読み込み中に別のフォルダへ切り替えた・閉じた場合は画面を触らない(キャッシュにだけ反映)
      if(sitePhotosCache[pickerCacheKey(siteName, pickerCurrentFolder)] !== cached || !$('photo-picker-modal').classList.contains('show')) return;
      const curBtn = $('pp-more');
      if(curBtn) curBtn.remove();
      $('pp-grid').querySelector('.pp-empty')?.remove();
      $('pp-grid').insertAdjacentHTML('beforeend', pickerItemsHtml(added, startIndex) + pickerMoreHtml(cached.photos.length, cached.totalCount));
      const noteEl = $('pp-note');
      if(noteEl){
        const text = pickerNoteText(cached.photos.length, cached.totalCount);
        if(text) noteEl.textContent = text; else noteEl.textContent = `全${cached.photos.length}件を表示中`;
      }
      // 取り込み済みで隠した枚数の表示も更新する
      const used = usedPhotoIds();
      const hidden = pickerShowUsed ? 0 : cached.photos.filter(p=>used[p.id]).length;
      let hn = $('pp-hidden-note');
      if(hidden){
        if(!hn){ $('pp-grid').insertAdjacentHTML('afterbegin','<div class="pp-note" id="pp-hidden-note"></div>'); hn=$('pp-hidden-note'); }
        hn.textContent = `台帳に取り込み済みの${hidden}枚は表示していません`;
      }
    })
    .catch(()=>{
      const curBtn = $('pp-more');
      if(!curBtn) return;
      curBtn.disabled = false;
      curBtn.textContent = '読み込みに失敗しました。押してもう一度読み込む';
    });
}
function closePhotoPicker(){
  closePickerPreview();
  $('photo-picker-modal').classList.remove('show');
  pickerTargetKey = null;
  pickerSelected = [];
}

function syncHeader(){
  header.koji=$('h-koji').value;
  header.genba=$('h-genba').value;
  header.addr=$('h-addr').value;
  header.gyosha=$('h-gyosha').value;
  document.querySelectorAll('.hv-koji').forEach(el=>el.textContent=header.koji);
  document.querySelectorAll('.hv-genba').forEach(el=>el.textContent=header.genba);
  document.querySelectorAll('.hv-addr').forEach(el=>el.textContent=header.addr);
  document.querySelectorAll('.hv-gyosha').forEach(el=>el.textContent=header.gyosha);
}

function saveData(){
  const fields={};
  document.querySelectorAll('[data-k]').forEach(el=>{fields[el.dataset.k]=el.value;});
  // 黒板前の元写真は、Drive写真のURL(短い文字列)だけ保存する(画像データまで保存すると容量が倍になるため)
  const origToSave={};
  Object.entries(photoOrig).forEach(([k,v])=>{ if(v && !String(v).startsWith('data:')) origToSave[k]=v; });
  const albumObj = {pageCount,header,photoData,photoSrc,photoOrig:origToSave,photoBoard,photoDate,fields};
  try{
    localStorage.setItem('photo-album',JSON.stringify(albumObj));
  }catch(e){/* ブラウザ内の一時保存に失敗しても、Driveへの保存は試みる */}

  const siteName = (header.genba || header.koji || '').trim();
  if(!siteName){
    alert('⚠️ 現場名が未入力のため、このブラウザ内にのみ一時保存しました。\nGoogleドライブに保存して後から一覧で開けるようにするには、上部で現場名を入力・選択してください。');
    return;
  }
  fetch(GAS_URL, {method:'POST', body: JSON.stringify({action:'saveAlbum', site:siteName, album:albumObj})})
    .then(r=>r.json())
    .then(res=>{
      if(res.status==='ok'){
        alert('✅ 保存しました（この現場の台帳としてGoogleドライブにも保存されました）');
      }else{
        alert('⚠️ ブラウザには保存しましたが、Googleドライブへの保存に失敗しました\n'+(res.message||''));
      }
    })
    .catch(()=>{
      alert('⚠️ ブラウザには保存しましたが、通信エラーのためGoogleドライブへの保存に失敗しました');
    });
}

// 保存データ（{pageCount,header,photoData,fields}）から画面を復元
function restoreAlbum(data){
  document.querySelectorAll('.page:not(.cover)').forEach(p=>p.remove());
  pageCount = 0;
  header=data.header||{koji:'',genba:'',addr:'',gyosha:''};
  photoData=data.photoData||{};
  photoSrc=data.photoSrc||{};
  photoOrig=data.photoOrig||{};
  photoBoard=data.photoBoard||{};
  photoDate=data.photoDate||{};
  $('h-koji').value=header.koji||'';
  $('h-genba').value=header.genba||'';
  $('h-addr').value=header.addr||'';
  $('h-gyosha').value=header.gyosha||'';
  const pc=data.pageCount||1;
  for(let i=0;i<pc;i++) addPage();
  if(data.fields){
    Object.entries(data.fields).forEach(([k,v])=>{
      const el=document.querySelector(`[data-k="${k}"]`);
      if(el) el.value=v;
    });
  }
  syncHeader();
}

function loadData(){
  loadSiteList();
  initCover();
  const saved=localStorage.getItem('photo-album');
  if(!saved){addPage();return;}
  try{
    restoreAlbum(JSON.parse(saved));
  }catch(e){addPage();}
}

function exportExcel(){
  // 印刷版と同じく、写真ページ(1ページ=写真最大3枚)単位でまとめる。1ページ=Excelのシート1枚に対応させる
  const pages=[];
  document.querySelectorAll('[data-photopage]').forEach(page=>{
    const pi=page.dataset.photopage;
    const pageEntries=[];
    let hasContent=false;
    for(let i=0;i<PHOTOS_PER_PAGE;i++){
      const key=`p${pi}-${i}`;
      const getV=k=>{const el=document.querySelector(`[data-k="${key}-${k}"]`);return el?el.value:'';};
      const ko=getV('kosyu'),pl=getV('place'),cm=getV('comment');
      const photo=photoData[key]||'';
      if(ko||pl||cm||photo) hasContent=true;
      pageEntries.push({kosyu:ko,place:pl,comment:cm,photo:photo});
    }
    if(hasContent) pages.push(pageEntries);
  });
  if(!pages.length){alert('⚠️ 出力する写真・情報がありません');return;}

  const btn = event ? event.target : null;
  const before = btn ? btn.innerHTML : null;
  if(btn){btn.disabled=true;btn.innerHTML='⏳ 変換中…';}

  const siteName = (header.genba || header.koji || '').trim();
  fetch(GAS_URL, {method:'POST', body: JSON.stringify({action:'exportAlbumExcel', site:siteName, header:header, pages:pages})})
    .then(r=>r.json())
    .then(res=>{
      if(res.status!=='ok'){
        alert('⚠️ Excel変換に失敗しました\n'+(res.message||''));
        return;
      }
      const bin=atob(res.base64);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=res.filename||'工事写真台帳.xlsx';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    })
    .catch(()=>{
      alert('⚠️ 通信エラーのためExcel変換に失敗しました');
    })
    .finally(()=>{
      if(btn){btn.disabled=false;btn.innerHTML=before;}
    });
}

loadData();
</script>
