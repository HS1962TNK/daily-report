<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="現場情報">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>現場情報管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a1a;min-height:100vh}

/* ヘッダー */
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
.header-left .title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.header-left .sub{font-size:11px;color:#888;margin-top:2px}
.report-nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px;border:1.5px solid #d0d5dd;border-radius:8px;background:#fff;cursor:pointer;text-decoration:none;color:#344054;min-width:52px}
.report-nav-btn .ico{font-size:18px;line-height:1}
.report-nav-btn .lbl{font-size:10px;font-weight:600;white-space:nowrap}

/* コンテンツ */
.content{padding:12px;max-width:600px;margin:0 auto}
.btn-new{width:100%;padding:14px;background:#22c55e;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-refresh{padding:8px 14px;background:#fff;color:#6b7280;border:1.5px solid #e5e7eb;border-radius:8px;font-size:12px;cursor:pointer}

/* 現場カード */
.site-item{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.site-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.site-name{font-size:15px;font-weight:700;color:#1a1a1a}
.site-badge{font-size:10px;background:#eff6ff;color:#1d6fcf;padding:3px 8px;border-radius:20px;font-weight:600}
.badge-before{background:#eff6ff;color:#1d6fcf}
.badge-active{background:#ecfdf5;color:#16a34a}
.badge-done{background:#f3f4f6;color:#6b7280}
.site-info{font-size:12px;color:#6b7280;line-height:1.8}
.site-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn-diary{flex:1;min-width:120px;padding:9px;background:#1d6fcf;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.btn-files{padding:9px 12px;background:#fff;color:#7c3aed;border:1.5px solid #c4b5fd;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.btn-edit-s{padding:9px 12px;background:#fff;color:#374151;border:1.5px solid #e5e7eb;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.btn-del-s{padding:9px 12px;background:#fff;color:#ef4444;border:1.5px solid #fca5a5;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.file-count-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:#7c3aed;background:#f5f3ff;padding:2px 8px;border-radius:20px;font-weight:600;margin-top:4px;margin-right:4px}
.empty-state{text-align:center;padding:48px 20px;color:#9ca3af}
.empty-icon{font-size:48px;margin-bottom:12px}

/* モーダル共通 */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;overflow-y:auto}
.overlay.show{display:block}
.panel{background:#f0f2f5;min-height:100%;padding:12px}
.panel-header{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:16px;font-weight:700}
.btn-close{padding:6px 14px;background:#fff;color:#6b7280;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px;cursor:pointer}

/* フォーム */
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.card-title{font-size:13px;font-weight:700;color:#374151;margin-bottom:12px}
.field{margin-bottom:10px}
label{font-size:12px;color:#6b7280;margin-bottom:4px;display:block;font-weight:500}
input[type=text],input[type=date],textarea{width:100%;padding:10px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;color:#1a1a1a;background:#fff;-webkit-appearance:none}
input:focus,textarea:focus{outline:none;border-color:#1d6fcf}
textarea{min-height:60px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}

/* 添付タブ */
.attach-tabs{display:flex;gap:6px;margin-bottom:10px}
.attach-tab{flex:1;padding:7px;border:1.5px solid #e5e7eb;border-radius:8px;background:#fff;font-size:12px;font-weight:600;color:#6b7280;cursor:pointer;text-align:center}
.attach-tab.active{border-color:#1d6fcf;background:#eff6ff;color:#1d6fcf}

/* ドラッグ＆ドロップゾーン */
.drop-zone{border:2px dashed #d1d5db;border-radius:12px;padding:24px;text-align:center;color:#9ca3af;font-size:13px;cursor:pointer;transition:all .2s;background:#fafafa;margin-bottom:10px}
.drop-zone.drag-over{border-color:#1d6fcf;background:#eff6ff;color:#1d6fcf}
.drop-zone .drop-icon{font-size:32px;margin-bottom:8px}
.drop-zone .drop-text{font-weight:600;margin-bottom:4px}
.drop-zone .drop-sub{font-size:11px}

/* 写真グリッド */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.photo-slot{border:1.5px solid #e5e7eb;border-radius:10px;overflow:hidden;position:relative;background:#f9fafb}
.photo-preview{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.photo-cap-input{width:100%;padding:5px 8px;border:none;border-top:1px solid #e5e7eb;font-size:11px;background:#fff;color:#374151}
.photo-cap-input:focus{outline:none;background:#f0f6ff}
.photo-del-btn{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0}

/* 書類リスト */
.doc-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.doc-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px}
.doc-icon{font-size:20px;flex-shrink:0}
.doc-name{flex:1;font-size:12px;font-weight:600;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-size{font-size:10px;color:#9ca3af;flex-shrink:0}
.doc-del{padding:3px 8px;border:1px solid #fca5a5;border-radius:6px;background:#fff;color:#ef4444;font-size:11px;cursor:pointer;flex-shrink:0}

/* 進捗バー */
.upload-progress{margin-top:8px;font-size:12px;color:#6b7280;text-align:center;padding:8px;background:#f9fafb;border-radius:8px;display:none}
.upload-progress.show{display:block}
.progress-bar-wrap{height:6px;background:#e5e7eb;border-radius:3px;margin-top:6px;overflow:hidden}
.progress-bar-fill{height:100%;background:#1d6fcf;border-radius:3px;transition:width .3s}

/* ファイル閲覧 */
.files-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;overflow-y:auto}
.files-overlay.show{display:block}
.files-panel{background:#fff;margin:20px 12px;border-radius:16px;overflow:hidden;max-width:560px;margin-left:auto;margin-right:auto}
.files-header{background:#1d6fcf;padding:16px;display:flex;align-items:center;justify-content:space-between}
.files-title{font-size:15px;font-weight:700;color:#fff}
.files-close{padding:5px 12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:8px;color:#fff;font-size:13px;cursor:pointer}
.files-body{padding:16px}
.photo-view-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.photo-view-item{border-radius:8px;overflow:hidden;cursor:pointer}
.photo-view-item img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.photo-view-cap{font-size:10px;color:#6b7280;text-align:center;padding:3px;background:#f9fafb}
.file-view-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px}
.file-view-icon{font-size:24px;flex-shrink:0}
.file-view-info{flex:1;overflow:hidden}
.file-view-name{font-size:13px;font-weight:600;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-view-meta{font-size:11px;color:#9ca3af;margin-top:2px}
.btn-open-file{padding:6px 12px;background:#1d6fcf;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0}

/* 保存・キャンセル */
.btn-save{width:100%;padding:14px;background:#1d6fcf;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.btn-save:disabled{background:#93c5fd;cursor:not-allowed}
.btn-cancel{width:100%;padding:12px;background:#fff;color:#6b7280;border:1.5px solid #e5e7eb;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}

/* トースト・ローディング */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.loading{text-align:center;padding:32px;color:#9ca3af;font-size:13px}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="title">🏗️ 現場情報</div>
    <div class="sub" id="sync-label">読み込み中…</div>
  </div>
  <a href="index.html" class="report-nav-btn">
    <span class="ico">📋</span>
    <span class="lbl">作業日報</span>
  </a>
</div>

<div class="content">
  <button class="btn-new" onclick="openForm()">＋ 新しい現場を登録</button>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <span id="site-count" style="font-size:12px;color:#6b7280"></span>
    <button class="btn-refresh" onclick="loadSites(true)">🔄 更新</button>
  </div>
  <div id="sites-list"><div class="loading">読み込み中…</div></div>
</div>

<!-- 登録・編集フォーム -->
<div class="overlay" id="overlay">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title" id="form-title">現場を登録</div>
      <button class="btn-close" onclick="closeForm()">✕ 閉じる</button>
    </div>

    <div class="card">
      <div class="card-title">📍 基本情報</div>
      <div class="field">
        <label>現場名 <span style="color:#ef4444">*</span></label>
        <input type="text" id="g-name" placeholder="例：○○マンション新築工事">
      </div>
      <div class="field">
        <label>住所</label>
        <input type="text" id="g-address" placeholder="例：大阪市中央区○○町1-2-3">
      </div>
      <div class="field">
        <label>施主名</label>
        <input type="text" id="g-client" placeholder="例：○○株式会社">
      </div>
    </div>

    <div class="card">
      <div class="card-title">📅 工期・担当</div>
      <div class="row2">
        <div><label>工期 開始</label><input type="date" id="g-start"></div>
        <div><label>工期 終了</label><input type="date" id="g-end"></div>
      </div>
      <div class="field">
        <label>担当者</label>
        <input type="text" id="g-manager" placeholder="例：田中太郎">
      </div>
    </div>

    <div class="card">
      <div class="card-title">📝 備考</div>
      <textarea id="g-note" placeholder="特記事項・備考など"></textarea>
    </div>

    <!-- 写真・書類添付 -->
    <div class="card">
      <div class="card-title">📎 写真・書類の添付</div>
      <div class="attach-tabs">
        <button class="attach-tab active" onclick="switchAttachTab('photo',this)">📷 写真</button>
        <button class="attach-tab" onclick="switchAttachTab('doc',this)">📄 書類（PDF・Excel）</button>
      </div>

      <!-- 写真タブ -->
      <div id="attach-photo">
        <!-- ドラッグ＆ドロップゾーン -->
        <div class="drop-zone" id="photo-drop-zone"
          ondragover="onDragOver(event,'photo')"
          ondragleave="onDragLeave('photo')"
          ondrop="onDropPhoto(event)"
          onclick="document.getElementById('photo-file-input').click()">
          <div class="drop-icon">📷</div>
          <div class="drop-text">ここに写真をドラッグ＆ドロップ</div>
          <div class="drop-sub">またはクリックして選択（JPEG・PNG対応）</div>
        </div>
        <input type="file" id="photo-file-input" accept="image/*" multiple
          style="display:none" onchange="addPhotosFromInput(this)">
        <div class="photo-grid" id="photo-grid"></div>
      </div>

      <!-- 書類タブ -->
      <div id="attach-doc" style="display:none">
        <!-- ドラッグ＆ドロップゾーン -->
        <div class="drop-zone" id="doc-drop-zone"
          ondragover="onDragOver(event,'doc')"
          ondragleave="onDragLeave('doc')"
          ondrop="onDropDoc(event)"
          onclick="document.getElementById('doc-file-input').click()">
          <div class="drop-icon">📄</div>
          <div class="drop-text">ここにファイルをドラッグ＆ドロップ</div>
          <div class="drop-sub">PDF・Excel（xlsx・xls）・CSV対応</div>
        </div>
        <input type="file" id="doc-file-input" accept=".pdf,.xlsx,.xls,.csv" multiple
          style="display:none" onchange="addDocsFromInput(this)">
        <div class="doc-list" id="doc-list"></div>
      </div>

      <div class="upload-progress" id="upload-progress">
        <span id="upload-msg">アップロード中…</span>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <button class="btn-save" id="save-btn" onclick="saveSite()">💾 登録する</button>
    <button class="btn-cancel" onclick="closeForm()">キャンセル</button>
    <div style="height:20px"></div>
  </div>
</div>

<!-- ファイル閲覧オーバーレイ -->
<div class="files-overlay" id="files-overlay">
  <div class="files-panel">
    <div class="files-header">
      <div class="files-title" id="files-title">現場ファイル</div>
      <button class="files-close" onclick="closeFiles()">✕ 閉じる</button>
    </div>
    <div class="files-body" id="files-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycby9b1XxHyum6h_k50ki3kFLDrauDAEXPXAq5GwzSXcr61A9DpvRlf5q3nLCYSYlO9_j/exec';

let sites        = [];
let editingName  = null;
let photoSlots   = [];  // [{id, data, caption}]
let docFiles     = [];  // [{id, name, size, type, data}]

window.onload = () => loadSites();

// ─────────────────────────────────────────
// ユーティリティ
// ─────────────────────────────────────────
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function uid(){ return 'id' + Date.now() + Math.random().toString(36).slice(2,6); }

function formatSize(bytes){
  if(bytes < 1024)       return bytes + 'B';
  if(bytes < 1024*1024)  return Math.round(bytes/1024) + 'KB';
  return (bytes/1024/1024).toFixed(1) + 'MB';
}

function docIcon(type, name){
  const n = (name||'').toLowerCase();
  if((type||'').includes('pdf') || n.endsWith('.pdf'))   return '📕';
  if(n.endsWith('.xlsx') || n.endsWith('.xls'))           return '📗';
  if(n.endsWith('.csv'))                                  return '📊';
  return '📄';
}

// 今日の日付を yyyy-MM-dd 文字列で取得
function todayStr(){
  const d = new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + mm + '-' + dd;
}

// 工期の開始日・終了日から状態（作業前／作業中／作業完了）を判定
function getSiteStatus(s){
  if(!s.startDate && !s.endDate) return null;
  const today = todayStr();
  if(s.startDate && today < s.startDate) return {label:'作業前', cls:'badge-before'};
  if(s.endDate && today > s.endDate)     return {label:'作業完了', cls:'badge-done'};
  return {label:'作業中', cls:'badge-active'};
}

// 現場カードに表示するバッジのHTML
function siteBadgeHtml(s){
  const st = getSiteStatus(s);
  return st ? `<div class="site-badge ${st.cls}">${st.label}</div>` : '';
}

function showToast(msg, dur=2800){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload  = e => resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

// ─────────────────────────────────────────
// 現場一覧
// ─────────────────────────────────────────
function loadSites(showMsg){
  if(showMsg) showToast('🔄 更新中…');
  document.getElementById('sites-list').innerHTML = '<div class="loading">読み込み中…</div>';

  fetch(GAS_URL + '?action=getSites')
    .then(r => r.json())
    .then(res => {
      sites = res.sites || [];
      localStorage.setItem('genba-sites', JSON.stringify(sites));
      renderSites();
      document.getElementById('sync-label').textContent =
        '最終更新：' + new Date().toLocaleString('ja-JP');
      if(showMsg) showToast('✅ 更新しました');
    })
    .catch(() => {
      sites = JSON.parse(localStorage.getItem('genba-sites') || '[]');
      renderSites();
      document.getElementById('sync-label').textContent = 'オフライン（キャッシュ表示）';
      if(showMsg) showToast('⚠️ オフラインのためキャッシュを表示');
    });
}

function renderSites(){
  const el = document.getElementById('sites-list');
  document.getElementById('site-count').textContent = sites.length + '件の現場';

  if(!sites.length){
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🏗️</div>
      <p>現場が登録されていません<br>「＋ 新しい現場を登録」から追加してください</p>
    </div>`;
    return;
  }

  el.innerHTML = sites.map(s => {
    const photoCount = (s.photos||[]).length;
    const docCount   = (s.docs||[]).length;
    const hasFiles   = photoCount > 0 || docCount > 0;
    return `
    <div class="site-item">
      <div class="site-head">
        <div class="site-name">${esc(s.name)}</div>
        ${siteBadgeHtml(s)}
      </div>
      <div class="site-info">
        ${s.address   ? `<span>📍 ${esc(s.address)}</span>` : ''}
        ${s.client    ? `<span>🏢 ${esc(s.client)}</span>`  : ''}
        ${s.manager   ? `<span>👤 ${esc(s.manager)}</span>` : ''}
        ${(s.startDate||s.endDate) ? `<br><span>📅 ${s.startDate||''}〜${s.endDate||''}</span>` : ''}
        ${s.note      ? `<br><span>📝 ${esc(s.note)}</span>` : ''}
      </div>
      ${hasFiles ? `<div style="margin-top:6px">
        ${photoCount > 0 ? `<span class="file-count-badge">📷 写真 ${photoCount}枚</span>` : ''}
        ${docCount   > 0 ? `<span class="file-count-badge">📄 書類 ${docCount}件</span>`  : ''}
      </div>` : ''}
      <div class="site-actions">
        <button class="btn-diary"  onclick="goToDiary('${esc(s.name)}')">✏️ この現場の日報を入力する</button>
        ${s.photoFolderUrl ? `<button onclick="window.open('${s.photoFolderUrl}','_blank')" style="padding:9px 12px;background:#fff;color:#16a34a;border:1.5px solid #86efac;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer">📷 写真を見る</button>` : (s.folderUrl ? `<button onclick="window.open('${s.folderUrl}','_blank')" style="padding:9px 12px;background:#fff;color:#16a34a;border:1.5px solid #86efac;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer">📷 写真を見る</button>` : '')}
        ${s.docFolderUrl ? `<button onclick="window.open('${s.docFolderUrl}','_blank')" style="padding:9px 12px;background:#fff;color:#7c3aed;border:1.5px solid #c4b5fd;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer">📄 書類を見る</button>` : ''}
        <button onclick="goToAlbum('${esc(s.name)}')" style="padding:9px 12px;background:#fff;color:#d97706;border:1.5px solid #fcd34d;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer">📷 写真台帳を作成</button>
        <button class="btn-edit-s" onclick="openEditForm('${esc(s.name)}')">編集</button>
        <button class="btn-del-s"  onclick="deleteSite('${esc(s.name)}')">削除</button>
      </div>
    </div>`;
  }).join('');
}

function goToDiary(name){
  location.href = 'index.html?site=' + encodeURIComponent(name);
}

function goToAlbum(name){
  location.href = 'photo-album.html?site=' + encodeURIComponent(name);
}

// ─────────────────────────────────────────
// ドラッグ＆ドロップ
// ─────────────────────────────────────────
function onDragOver(e, type){
  e.preventDefault();
  document.getElementById(type === 'photo' ? 'photo-drop-zone' : 'doc-drop-zone')
    .classList.add('drag-over');
}

function onDragLeave(type){
  document.getElementById(type === 'photo' ? 'photo-drop-zone' : 'doc-drop-zone')
    .classList.remove('drag-over');
}

async function onDropPhoto(e){
  e.preventDefault();
  document.getElementById('photo-drop-zone').classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  if(!files.length){ showToast('⚠️ 画像ファイルを選択してください'); return; }
  await loadPhotoFiles(files);
}

async function onDropDoc(e){
  e.preventDefault();
  document.getElementById('doc-drop-zone').classList.remove('drag-over');
  const allowed = ['.pdf','.xlsx','.xls','.csv'];
  const files = Array.from(e.dataTransfer.files).filter(f => {
    const n = f.name.toLowerCase();
    return allowed.some(ext => n.endsWith(ext));
  });
  if(!files.length){ showToast('⚠️ PDF・Excel・CSVファイルを選択してください'); return; }
  await loadDocFiles(files);
}

async function addPhotosFromInput(input){
  await loadPhotoFiles(Array.from(input.files));
  input.value = '';
}

async function addDocsFromInput(input){
  await loadDocFiles(Array.from(input.files));
  input.value = '';
}

// ─────────────────────────────────────────
// 写真処理
// ─────────────────────────────────────────
async function loadPhotoFiles(files){
  for(const file of files){
    try {
      const data = await readFileAsDataURL(file);
      photoSlots.push({ id: uid(), data, caption: '' });
    } catch(e) {
      showToast('⚠️ ' + file.name + ' の読み込みに失敗しました');
    }
  }
  renderPhotoGrid();
}

function renderPhotoGrid(){
  const grid = document.getElementById('photo-grid');
  grid.innerHTML = photoSlots.map(p => `
    <div class="photo-slot">
      <img class="photo-preview" src="${p.data}">
      <button class="photo-del-btn" onclick="removePhoto('${p.id}')">✕</button>
      <input type="text" class="photo-cap-input" placeholder="説明（任意）"
        value="${esc(p.caption)}" oninput="updateCaption('${p.id}',this.value)">
    </div>
  `).join('');
}

function removePhoto(id){
  photoSlots = photoSlots.filter(p => p.id !== id);
  renderPhotoGrid();
}

function updateCaption(id, val){
  const p = photoSlots.find(x => x.id === id);
  if(p) p.caption = val;
}

// ─────────────────────────────────────────
// 書類処理
// ─────────────────────────────────────────
async function loadDocFiles(files){
  for(const file of files){
    try {
      const data = await readFileAsDataURL(file);
      docFiles.push({ id: uid(), name: file.name, size: file.size, type: file.type, data });
    } catch(e) {
      showToast('⚠️ ' + file.name + ' の読み込みに失敗しました');
    }
  }
  renderDocList();
}

function renderDocList(){
  const list = document.getElementById('doc-list');
  list.innerHTML = docFiles.map(f => `
    <div class="doc-item">
      <div class="doc-icon">${docIcon(f.type, f.name)}</div>
      <div class="doc-name" title="${esc(f.name)}">${esc(f.name)}</div>
      <div class="doc-size">${formatSize(f.size)}</div>
      <button class="doc-del" onclick="removeDoc('${f.id}')">削除</button>
    </div>
  `).join('');
}

function removeDoc(id){
  docFiles = docFiles.filter(f => f.id !== id);
  renderDocList();
}

// ─────────────────────────────────────────
// 添付タブ切替
// ─────────────────────────────────────────
function switchAttachTab(tab, btn){
  document.querySelectorAll('.attach-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('attach-photo').style.display = tab === 'photo' ? '' : 'none';
  document.getElementById('attach-doc').style.display   = tab === 'doc'   ? '' : 'none';
}

// ─────────────────────────────────────────
// フォーム開閉・クリア
// ─────────────────────────────────────────
function openForm(){
  editingName = null;
  document.getElementById('form-title').textContent    = '現場を登録';
  document.getElementById('save-btn').textContent      = '💾 登録する';
  clearForm();
  document.getElementById('overlay').classList.add('show');
  document.getElementById('g-name').focus();
}

function openEditForm(name){
  const s = sites.find(x => x.name === name);
  if(!s) return;
  editingName = name;
  document.getElementById('form-title').textContent    = '現場を編集';
  document.getElementById('save-btn').textContent      = '💾 更新する';
  document.getElementById('g-name').value    = s.name      || '';
  document.getElementById('g-address').value = s.address   || '';
  document.getElementById('g-client').value  = s.client    || '';
  document.getElementById('g-start').value   = s.startDate || '';
  document.getElementById('g-end').value     = s.endDate   || '';
  document.getElementById('g-manager').value = s.manager   || '';
  document.getElementById('g-note').value    = s.note      || '';
  // 編集時は新規追加のみ（既存ファイルはファイルボタンで閲覧）
  photoSlots = [];
  docFiles   = [];
  renderPhotoGrid();
  renderDocList();
  document.getElementById('overlay').classList.add('show');
}

function closeForm(){
  document.getElementById('overlay').classList.remove('show');
  clearForm();
}

function clearForm(){
  ['g-name','g-address','g-client','g-start','g-end','g-manager','g-note']
    .forEach(id => { document.getElementById(id).value = ''; });
  photoSlots = [];
  docFiles   = [];
  renderPhotoGrid();
  renderDocList();
  document.getElementById('upload-progress').classList.remove('show');
}

// ─────────────────────────────────────────
// 登録・更新
// ─────────────────────────────────────────
async function saveSite(){
  const name = document.getElementById('g-name').value.trim();
  if(!name){ showToast('⚠️ 現場名は必須です'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled    = true;
  btn.textContent = '送信中…';

  // 編集時は古いデータを削除
  if(editingName){
    await fetch(GAS_URL + '?action=deleteSite&name=' + encodeURIComponent(editingName))
      .catch(() => {});
  }

  const hasFiles = photoSlots.some(p => p.data) || docFiles.length > 0;
  const success  = hasFiles ? await saveSiteWithFiles(name) : await saveSiteTextOnly(name);

  btn.disabled    = false;
  btn.textContent = editingName ? '💾 更新する' : '💾 登録する';

  if(success){
    showToast(editingName ? '✅ 更新しました' : '✅ 登録しました');
    closeForm();
    loadSites();
  }
}

// テキストのみ（GET）
async function saveSiteTextOnly(name){
  const p = new URLSearchParams({
    action:    'addSite', name,
    address:   document.getElementById('g-address').value.trim(),
    client:    document.getElementById('g-client').value.trim(),
    startDate: document.getElementById('g-start').value,
    endDate:   document.getElementById('g-end').value,
    manager:   document.getElementById('g-manager').value.trim(),
    note:      document.getElementById('g-note').value.trim()
  });
  try {
    const res = await fetch(GAS_URL + '?' + p.toString()).then(r => r.json());
    if(res.status !== 'ok'){ showToast('❌ ' + (res.message||'エラー')); return false; }
    return true;
  } catch(e){
    showToast('❌ 送信失敗（オフラインの可能性）');
    return false;
  }
}

// ファイル付き（POST）
async function saveSiteWithFiles(name){
  const prog = document.getElementById('upload-progress');
  const fill = document.getElementById('progress-fill');
  const msg  = document.getElementById('upload-msg');
  prog.classList.add('show');
  msg.textContent  = 'ファイルを送信中…';
  fill.style.width = '30%';

  const payload = {
    action:    'addSiteWithFiles', name,
    address:   document.getElementById('g-address').value.trim(),
    client:    document.getElementById('g-client').value.trim(),
    startDate: document.getElementById('g-start').value,
    endDate:   document.getElementById('g-end').value,
    manager:   document.getElementById('g-manager').value.trim(),
    note:      document.getElementById('g-note').value.trim(),
    photos:    photoSlots.filter(p => p.data).map(p => ({ data: p.data, caption: p.caption })),
    docs:      docFiles.map(f => ({ name: f.name, type: f.type, data: f.data }))
  };

  try {
    fill.style.width = '60%';
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body:   JSON.stringify(payload)
    }).then(r => r.json());
    fill.style.width = '100%';
    msg.textContent  = '送信完了！';
    setTimeout(() => prog.classList.remove('show'), 1000);
    if(res.status !== 'ok'){ showToast('❌ ' + (res.message||'エラー')); return false; }
    return true;
  } catch(e){
    prog.classList.remove('show');
    showToast('⚠️ ファイル送信失敗。テキストのみ登録します。');
    return await saveSiteTextOnly(name);
  }
}

// ─────────────────────────────────────────
// ファイル閲覧
// ─────────────────────────────────────────
function openFiles(name){
  const s = sites.find(x => x.name === name);
  if(!s) return;

  document.getElementById('files-title').textContent = '📎 ' + name;

  const photos = s.photos || [];
  const docs   = s.docs   || [];
  let html = '';

  if(photos.length){
    html += `<div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:8px">
      📷 現場写真（${photos.length}枚）</div>
      <div class="photo-view-grid">`;
    photos.forEach(p => {
      html += `<div class="photo-view-item" onclick="window.open('${p.url}','_blank')">
        <img src="${p.url}" alt="${esc(p.caption||'')}">
        ${p.caption ? `<div class="photo-view-cap">${esc(p.caption)}</div>` : ''}
      </div>`;
    });
    html += '</div>';
  }

  if(docs.length){
    html += `<div style="font-size:12px;font-weight:700;color:#374151;margin:12px 0 8px">
      📄 書類（${docs.length}件）</div>`;
    docs.forEach(d => {
      html += `<div class="file-view-item">
        <div class="file-view-icon">${docIcon(d.type||'', d.name||'')}</div>
        <div class="file-view-info">
          <div class="file-view-name">${esc(d.name)}</div>
          <div class="file-view-meta">${d.type||''}</div>
        </div>
        <button class="btn-open-file" onclick="window.open('${d.url}','_blank')">開く</button>
      </div>`;
    });
  }

  if(!photos.length && !docs.length){
    html = '<p style="color:#9ca3af;text-align:center;padding:20px">ファイルがありません</p>';
  }

  document.getElementById('files-body').innerHTML = html;
  document.getElementById('files-overlay').classList.add('show');
}

function closeFiles(){
  document.getElementById('files-overlay').classList.remove('show');
}

// ─────────────────────────────────────────
// 削除
// ─────────────────────────────────────────
function deleteSite(name){
  if(!confirm('「'+name+'」を削除しますか？\n（日報データは残ります）')) return;
  fetch(GAS_URL + '?action=deleteSite&name=' + encodeURIComponent(name))
    .then(r => r.json())
    .then(() => { showToast('🗑️ 削除しました'); loadSites(); })
    .catch(() => {
      const cached = JSON.parse(localStorage.getItem('genba-sites')||'[]');
      localStorage.setItem('genba-sites',
        JSON.stringify(cached.filter(x => x.name !== name)));
      sites = sites.filter(x => x.name !== name);
      renderSites();
      showToast('🗑️ 削除しました（オフライン）');
    });
}
</script>
