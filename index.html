<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作業日報">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>工事作業日報</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a1a;min-height:100vh}

/* ヘッダー */
.header{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
.header-title{font-size:17px;font-weight:700;color:#1a1a1a;display:flex;align-items:center;gap:6px}
.header-title span{font-size:20px}
.header-sub{font-size:11px;color:#888;margin-top:1px}

/* 現場情報ボタン（ヘッダー右上）*/
.site-nav-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:6px 10px;border:1.5px solid #d0d5dd;border-radius:8px;
  background:#fff;cursor:pointer;text-decoration:none;color:#344054;
  font-size:9px;font-weight:600;line-height:1;min-width:52px;
  transition:background .15s
}
.site-nav-btn:hover{background:#f9fafb}
.site-nav-btn .btn-icon{font-size:18px;line-height:1}
.site-nav-btn .btn-label{font-size:10px;white-space:nowrap}

/* タブナビ */
.tab-nav{background:#fff;display:flex;border-bottom:1px solid #e5e7eb;position:sticky;top:57px;z-index:99}
.tab-btn{flex:1;padding:12px 4px 10px;font-size:11px;color:#888;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500;border-bottom:2.5px solid transparent;transition:.15s}
.tab-btn .t-icon{font-size:18px}
.tab-btn.active{color:#1d6fcf;border-bottom-color:#1d6fcf;font-weight:700}

/* コンテンツエリア */
.tab-content{display:none;padding:12px;max-width:600px;margin:0 auto}
.tab-content.active{display:block}

/* カード */
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.card-title{font-size:13px;font-weight:700;color:#374151;margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* フォーム要素 */
label{font-size:12px;color:#6b7280;margin-bottom:4px;display:block;font-weight:500}
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%;padding:10px 12px;border:1.5px solid #e5e7eb;border-radius:8px;
  font-size:14px;color:#1a1a1a;background:#fff;appearance:none;-webkit-appearance:none;
  transition:border-color .15s
}
input:focus,textarea:focus,select:focus{outline:none;border-color:#1d6fcf}
textarea{min-height:80px;resize:vertical;line-height:1.5}

/* 行グリッド */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 80px auto;gap:8px;align-items:end}

/* 進捗スライダー */
.progress-wrap{margin-top:8px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:#6b7280;margin-bottom:6px}
.progress-val{font-weight:700;color:#1d6fcf;font-size:14px}
input[type=range]{width:100%;height:6px;accent-color:#1d6fcf}

/* ボタン類 */
.btn-add{width:100%;padding:10px;border:1.5px dashed #d1d5db;border-radius:8px;background:none;color:#6b7280;font-size:13px;cursor:pointer;margin-top:8px;transition:.15s}
.btn-add:hover{border-color:#1d6fcf;color:#1d6fcf;background:#f0f6ff}
.btn-del{width:32px;height:36px;border:1.5px solid #fca5a5;border-radius:8px;background:#fff;color:#ef4444;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-save{width:100%;padding:15px;background:#1d6fcf;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;transition:.15s}
.btn-save:hover{background:#1558a8}
.btn-save:disabled{background:#93c5fd;cursor:not-allowed}
.btn-primary{padding:8px 14px;background:#1d6fcf;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-outline{padding:8px 14px;background:#fff;color:#1d6fcf;border:1.5px solid #1d6fcf;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}

/* 保護具チェック */
.safety-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.safety-item{border:1.5px solid #e5e7eb;border-radius:8px;padding:10px 6px;text-align:center;cursor:pointer;font-size:11px;font-weight:600;color:#6b7280;transition:.15s;user-select:none}
.safety-item.checked{border-color:#22c55e;background:#f0fdf4;color:#16a34a}

/* 天気ボタン */
.weather-btn{width:100%;padding:10px;background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:8px;color:#1d6fcf;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px}

/* 写真スロット */
.photos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.photo-slot{border:1.5px dashed #d1d5db;border-radius:10px;padding:8px;background:#fafafa}
.photo-preview{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.photo-placeholder{width:100%;aspect-ratio:4/3;background:#f3f4f6;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:#9ca3af;font-size:11px}
.photo-actions{display:flex;gap:4px;margin-top:6px}
.photo-actions button{flex:1;padding:5px 4px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;font-size:10px;cursor:pointer;color:#374151}
.photo-del{border-color:#fca5a5!important;color:#ef4444!important;flex:0 0 28px!important}
.photo-memo{margin-top:5px;width:100%;padding:5px 8px;border:1px solid #e5e7eb;border-radius:6px;font-size:11px;color:#374151}

/* 現場名ドロップダウン行 */
.site-row{display:flex;gap:8px;align-items:center}
.site-row select{flex:1}
.site-reg-btn{flex-shrink:0;padding:10px 12px;background:#1d6fcf;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}

/* 履歴 */
.history-item{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.history-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.history-date{font-size:13px;font-weight:700;color:#1a1a1a}
.history-site{font-size:12px;color:#1d6fcf;font-weight:600}
.history-progress{font-size:11px;color:#fff;background:#1d6fcf;padding:2px 8px;border-radius:20px;font-weight:600}
.history-body{font-size:12px;color:#6b7280;line-height:1.5;margin-bottom:8px}
.history-actions{display:flex;gap:6px}
.btn-edit{padding:6px 12px;background:#fff;border:1.5px solid #1d6fcf;border-radius:7px;color:#1d6fcf;font-size:12px;font-weight:600;cursor:pointer}
.btn-del-history{padding:6px 12px;background:#fff;border:1.5px solid #fca5a5;border-radius:7px;color:#ef4444;font-size:12px;font-weight:600;cursor:pointer}

/* Excel出力 */
.excel-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.btn-download{width:100%;padding:12px;background:#217346;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
.btn-download-all{width:100%;padding:12px;background:#1d6fcf;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}

/* トースト */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* ワークアイテム行 */
.worker-row{display:grid;grid-template-columns:1fr 72px auto;gap:6px;margin-bottom:6px;align-items:start}
.worker-names{margin-top:4px;width:100%;padding:7px 10px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px;color:#1a1a1a}

/* 材料行 */
.material-row{display:grid;grid-template-columns:1fr 72px 80px auto;gap:6px;margin-bottom:6px;align-items:end}

/* 空状態 */
.empty-state{text-align:center;padding:40px 20px;color:#9ca3af}
.empty-state .empty-icon{font-size:40px;margin-bottom:8px}
.empty-state p{font-size:13px}

/* レスポンシブ */
@media(max-width:380px){
  .safety-grid{grid-template-columns:repeat(2,1fr)}
  .photos-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <div>
    <div class="header-title"><span>📋</span> 作業日報</div>
    <div class="header-sub" id="today-date"></div>
  </div>
  <a href="genba.html" class="site-nav-btn">
    <span class="btn-icon">🏗️</span>
    <span class="btn-label">現場情報</span>
  </a>
</div>

<!-- タブナビ -->
<div class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('input')">
    <span class="t-icon">✏️</span>入力
  </button>
  <button class="tab-btn" onclick="switchTab('history')">
    <span class="t-icon">📂</span>履歴
  </button>
  <button class="tab-btn" onclick="switchTab('excel')">
    <span class="t-icon">📊</span>Excel出力
  </button>
</div>

<!-- 入力タブ -->
<div id="tab-input" class="tab-content active">

  <!-- 基本情報 -->
  <div class="card">
    <div class="card-title">📍 基本情報</div>
    <div style="margin-bottom:10px">
      <label>日付</label>
      <input type="date" id="f-date">
    </div>
    <div style="margin-bottom:10px">
      <label>現場名</label>
      <div class="site-row">
        <select id="f-site" style="color:#1a1a1a">
          <option value="">現場を選択してください</option>
        </select>
        <button class="site-reg-btn" onclick="goToGenba()">＋ 現場登録</button>
      </div>
    </div>
    <div>
      <label>報告者名</label>
      <input type="text" id="f-reporter" placeholder="氏名">
    </div>
  </div>

  <!-- 天気 -->
  <div class="card">
    <div class="card-title">🌤️ 天気・気温</div>
    <button class="weather-btn" onclick="getWeather()">📍 現在地の天気を自動取得</button>
    <div class="row2">
      <div>
        <label>天気（修正可）</label>
        <select id="f-weather">
          <option value="">選択</option>
          <option>晴れ</option><option>曇り</option><option>雨</option><option>雪</option>
        </select>
      </div>
      <div>
        <label>最高気温（℃）</label>
        <input type="number" id="f-temp" placeholder="28">
      </div>
    </div>
  </div>

  <!-- 作業員 -->
  <div class="card">
    <div class="card-title">👷 作業員・人数</div>
    <div id="workers-list"></div>
    <button class="btn-add" onclick="addWorker()">＋ 職種・人員を追加</button>
  </div>

  <!-- 作業内容 -->
  <div class="card">
    <div class="card-title">📝 作業内容・進捗</div>
    <div style="margin-bottom:10px">
      <label>本日の作業内容</label>
      <textarea id="f-work" placeholder="本日の作業内容を入力してください"></textarea>
    </div>
    <div>
      <label>特記事項・問題点</label>
      <textarea id="f-note" placeholder="特記事項・問題点があれば入力してください" style="min-height:60px"></textarea>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>全体進捗</span>
        <span class="progress-val" id="progress-val">50%</span>
      </div>
      <input type="range" id="f-progress" min="0" max="100" value="50"
        oninput="document.getElementById('progress-val').textContent=this.value+'%'">
    </div>
  </div>

  <!-- 材料 -->
  <div class="card">
    <div class="card-title">📦 使用材料・数量</div>
    <div id="materials-list"></div>
    <button class="btn-add" onclick="addMaterial()">＋ 材料を追加</button>
  </div>

  <!-- 保護具 -->
  <div class="card">
    <div class="card-title">🦺 保護具の着用確認</div>
    <div class="safety-grid" id="safety-grid">
      <div class="safety-item" data-key="ヘルメット" onclick="toggleSafety(this)">⛑️<br>ヘルメット</div>
      <div class="safety-item" data-key="安全帯" onclick="toggleSafety(this)">🔗<br>安全帯</div>
      <div class="safety-item" data-key="安全靴" onclick="toggleSafety(this)">👟<br>安全靴</div>
      <div class="safety-item" data-key="防塵マスク" onclick="toggleSafety(this)">😷<br>防塵マスク</div>
      <div class="safety-item" data-key="保護眼鏡" onclick="toggleSafety(this)">🥽<br>保護眼鏡</div>
      <div class="safety-item" data-key="作業手袋(ゴム製)" onclick="toggleSafety(this)">🧤<br>作業手袋<br>(ゴム製)</div>
    </div>
  </div>

  <!-- 写真 -->
  <div class="card">
    <div class="card-title">📷 工事写真</div>
    <div class="photos-grid" id="photos-grid"></div>
    <button class="btn-add" onclick="addPhotoSlot()" style="margin-top:10px">＋ 写真を追加</button>
  </div>

  <button class="btn-save" id="save-btn" onclick="saveReport()">💾 日報を保存</button>
  <div style="height:20px"></div>
</div>

<!-- 履歴タブ -->
<div id="tab-history" class="tab-content">
  <div id="history-list"></div>
</div>

<!-- Excel出力タブ -->
<div id="tab-excel" class="tab-content">
  <div class="excel-card">
    <p style="font-size:13px;color:#6b7280;margin-bottom:10px">現場ごとにシートを分けて出力します。写真はGoogle Driveの「工事写真アルバム」フォルダで確認できます。</p>
    <div id="excel-site-list"></div>
    <button class="btn-download-all" onclick="downloadAllExcel()">📥 全現場まとめてダウンロード</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycby9b1XxHyum6h_k50ki3kFLDrauDAEXPXAq5GwzSXcr61A9DpvRlf5q3nLCYSYlO9_j/exec';
const WEATHER_KEY = 'adc261f04d66d4fcd362785e0fada97d';
let editingId = null;
let photoSlots = [];
let workerCount = 0;
let materialCount = 0;

// 初期化
window.onload = function(){
  const now = new Date();
  document.getElementById('today-date').textContent =
    now.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  const y=now.getFullYear(), m=String(now.getMonth()+1).padStart(2,'0'), d=String(now.getDate()).padStart(2,'0');
  document.getElementById('f-date').value = `${y}-${m}-${d}`;
  loadSiteList();
  addWorker();
  addMaterial();
  addPhotoSlot();
};

// タブ切り替え
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',['input','history','excel'][i]===tab);
  });
  document.querySelectorAll('.tab-content').forEach(c=>{c.classList.remove('active')});
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='history') renderHistory();
  if(tab==='excel') renderExcel();
}

// 現場情報アプリへ
function goToGenba(){
  location.href='genba.html';
}

// 現場リスト読込
function loadSiteList(){
  const sites = JSON.parse(localStorage.getItem('genba-sites')||'[]');
  const sel = document.getElementById('f-site');
  const cur = sel.value;
  sel.innerHTML = '<option value="">現場を選択してください</option>';
  sites.forEach(s=>{
    const o=document.createElement('option');
    o.value=s.name; o.textContent=s.name;
    sel.appendChild(o);
  });
  if(cur) sel.value=cur;

  // URLパラメータで現場名を自動入力
  const params = new URLSearchParams(location.search);
  const siteParam = params.get('site');
  if(siteParam){
    sel.value=siteParam;
    history.replaceState({},'',location.pathname);
  }
}

// 作業員追加
function addWorker(){
  workerCount++;
  const id = 'w'+workerCount;
  const div = document.createElement('div');
  div.id = id;
  div.style.marginBottom='10px';
  div.innerHTML = `
    <div class="worker-row">
      <input type="text" class="w-role" placeholder="職種（例：鉄筋工）">
      <input type="number" class="w-cnt" placeholder="人数" min="0">
      <button class="btn-del" onclick="document.getElementById('${id}').remove()">✕</button>
    </div>
    <input type="text" class="worker-names" placeholder="作業員名（例：山田、田中、佐藤）">
  `;
  document.getElementById('workers-list').appendChild(div);
}

// 材料追加
function addMaterial(){
  materialCount++;
  const id = 'm'+materialCount;
  const div = document.createElement('div');
  div.id = id;
  div.className = 'material-row';
  div.innerHTML = `
    <input type="text" class="m-name" placeholder="材料名">
    <input type="number" class="m-qty" placeholder="数量" min="0" step="any">
    <select class="m-unit">
      <option value="">単位</option>
      <option>個</option><option>枚</option><option>本</option>
      <option>m</option><option>缶</option><option>袋</option>
      <option>セット</option><option>kg</option><option>L</option>
    </select>
    <button class="btn-del" onclick="document.getElementById('${id}').remove()">✕</button>
  `;
  document.getElementById('materials-list').appendChild(div);
}

// 保護具トグル
function toggleSafety(el){ el.classList.toggle('checked'); }

// 写真スロット追加
function addPhotoSlot(){
  const idx = photoSlots.length;
  photoSlots.push({data:null,label:'',memo:''});
  const grid = document.getElementById('photos-grid');
  const div = document.createElement('div');
  div.className = 'photo-slot';
  div.id = 'ps'+idx;
  div.innerHTML = `
    <div id="pimg${idx}">
      <div class="photo-placeholder"><span style="font-size:28px">📷</span><span>タップして撮影</span></div>
    </div>
    <div class="photo-actions">
      <button onclick="triggerCam(${idx})">📷 撮影</button>
      <button onclick="triggerLib(${idx})">🖼️ ライブラリ</button>
      <button class="photo-del" onclick="removePhoto(${idx})">✕</button>
    </div>
    <input type="text" class="photo-memo" id="pmemo${idx}" placeholder="メモ（場所・内容など）"
      oninput="photoSlots[${idx}].memo=this.value">
    <input type="file" id="pcam${idx}" accept="image/*" capture="environment" style="display:none" onchange="loadPhoto(${idx},this)">
    <input type="file" id="plib${idx}" accept="image/*" style="display:none" onchange="loadPhoto(${idx},this)">
  `;
  grid.appendChild(div);
}

function triggerCam(i){ document.getElementById('pcam'+i).click(); }
function triggerLib(i){ document.getElementById('plib'+i).click(); }

function loadPhoto(i, input){
  if(!input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e=>{
    photoSlots[i].data = e.target.result;
    const container = document.getElementById('pimg'+i);
    container.innerHTML = `<img class="photo-preview" src="${e.target.result}">`;
  };
  reader.readAsDataURL(input.files[0]);
}

function removePhoto(i){
  photoSlots[i] = {data:null,label:'',memo:''};
  const container = document.getElementById('pimg'+i);
  container.innerHTML = `<div class="photo-placeholder"><span style="font-size:28px">📷</span><span>タップして撮影</span></div>`;
  document.getElementById('pcam'+i).value='';
  document.getElementById('plib'+i).value='';
}

// 天気取得
function getWeather(){
  if(!navigator.geolocation){ showToast('位置情報が使えません'); return; }
  showToast('📍 位置情報を取得中…');
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat, longitude:lon} = pos.coords;
    fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${WEATHER_KEY}&units=metric&lang=ja`)
      .then(r=>r.json()).then(d=>{
        if(d.cod!=='200'){ showToast('天気の取得に失敗しました'); return; }
        const today = new Date().toISOString().substring(0,10);
        const todayList = d.list.filter(i=>i.dt_txt.startsWith(today));
        const maxT = todayList.length ? Math.max(...todayList.map(i=>i.main.temp_max)) : d.list[0].main.temp_max;
        const w = d.list[0].weather[0].description;
        let wSel = '';
        if(w.includes('晴')||w.includes('clear')) wSel='晴れ';
        else if(w.includes('雨')||w.includes('rain')) wSel='雨';
        else if(w.includes('雪')||w.includes('snow')) wSel='雪';
        else wSel='曇り';
        document.getElementById('f-weather').value = wSel;
        document.getElementById('f-temp').value = Math.round(maxT);
        showToast(`✅ ${wSel} ${Math.round(maxT)}℃`);
      }).catch(()=>showToast('天気の取得に失敗しました'));
  },()=>showToast('位置情報の取得を許可してください'));
}

// 保存
async function saveReport(){
  const date = document.getElementById('f-date').value;
  const site = document.getElementById('f-site').value.trim();
  if(!date||!site){ showToast('⚠️ 日付と現場名は必須です'); return; }

  document.getElementById('save-btn').disabled=true;
  document.getElementById('save-btn').textContent='保存中…';

  // 作業員収集
  const workers = [];
  document.querySelectorAll('#workers-list > div').forEach(div=>{
    const r = div.querySelector('.w-role')?.value.trim()||'';
    const c = div.querySelector('.w-cnt')?.value||'';
    const names = div.querySelector('.worker-names')?.value.trim()||'';
    if(r||c) workers.push({r,c,names});
  });

  // 材料収集
  const materials = [];
  document.querySelectorAll('#materials-list > div').forEach(div=>{
    const n=div.querySelector('.m-name')?.value.trim()||'';
    const q=div.querySelector('.m-qty')?.value||'';
    const u=div.querySelector('.m-unit')?.value||'';
    if(n) materials.push({n,q,u});
  });

  // 保護具
  const safety = {};
  document.querySelectorAll('#safety-grid .safety-item').forEach(el=>{
    safety[el.dataset.key] = el.classList.contains('checked');
  });

  // 写真（ローカル保存用）
  const photos = photoSlots.map(p=>({data:p.data||null,label:p.label,memo:p.memo}));
  const photoCount = photos.filter(p=>p.data).length;

  const report = {
    id: editingId || Date.now().toString(),
    date, site,
    reporter: document.getElementById('f-reporter').value.trim(),
    weather: document.getElementById('f-weather').value,
    temp: document.getElementById('f-temp').value,
    workers, materials, safety, photos,
    work: document.getElementById('f-work').value.trim(),
    note: document.getElementById('f-note').value.trim(),
    progress: document.getElementById('f-progress').value,
    photoCount,
    savedAt: new Date().toLocaleString('ja-JP')
  };

  // ローカル保存
  const all = JSON.parse(localStorage.getItem('daily-reports')||'[]');
  const idx = all.findIndex(r=>r.id===report.id);
  if(idx>=0) all[idx]=report; else all.unshift(report);
  // 写真なしバージョンを別途保存（容量節約）
  const allNoPhoto = all.map(r=>({...r,photos:r.photos.map(p=>({...p,data:null}))}));
  try{ localStorage.setItem('daily-reports', JSON.stringify(allNoPhoto)); }
  catch(e){ console.warn('ローカル保存失敗',e); }

  // GASへ送信（写真含む）
  const gasData = {...report};
  sendToGAS(gasData);

  // フォームリセット
  document.getElementById('save-btn').disabled=false;
  document.getElementById('save-btn').textContent='💾 日報を保存';
  showToast('✅ 日報を保存しました！');
  editingId = null;
  resetForm();
}

function sendToGAS(data){
  const payload = {...data};
  fetch(GAS_URL, {
    method:'POST',
    body: JSON.stringify(payload)
  }).then(r=>r.json()).then(res=>{
    if(res.status==='ok') showToast('📊 スプレッドシートに送信しました');
  }).catch(()=>{
    // バックグラウンド送信失敗はサイレントに
  });
}

// フォームリセット
function resetForm(){
  document.getElementById('f-site').value='';
  document.getElementById('f-reporter').value='';
  document.getElementById('f-weather').value='';
  document.getElementById('f-temp').value='';
  document.getElementById('f-work').value='';
  document.getElementById('f-note').value='';
  document.getElementById('f-progress').value=50;
  document.getElementById('progress-val').textContent='50%';
  document.querySelectorAll('#safety-grid .safety-item').forEach(el=>el.classList.remove('checked'));
  document.getElementById('workers-list').innerHTML='';
  document.getElementById('materials-list').innerHTML='';
  document.getElementById('photos-grid').innerHTML='';
  photoSlots=[];workerCount=0;materialCount=0;
  addWorker();addMaterial();addPhotoSlot();
  const now=new Date();
  const y=now.getFullYear(),m=String(now.getMonth()+1).padStart(2,'0'),d=String(now.getDate()).padStart(2,'0');
  document.getElementById('f-date').value=`${y}-${m}-${d}`;
}

// 履歴表示
function renderHistory(){
  const all = JSON.parse(localStorage.getItem('daily-reports')||'[]');
  const el = document.getElementById('history-list');
  if(!all.length){
    el.innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><p>保存された日報はありません</p></div>';
    return;
  }
  el.innerHTML = all.map(r=>`
    <div class="history-item">
      <div class="history-head">
        <div>
          <div class="history-date">${r.date}</div>
          <div class="history-site">${r.site}</div>
        </div>
        <div class="history-progress">${r.progress}%</div>
      </div>
      <div class="history-body">
        ${r.reporter?'報告者：'+r.reporter+'　':''}
        ${r.weather?r.weather+(r.temp?r.temp+'℃':'')+'　':''}
        写真：${r.photoCount||0}枚<br>
        ${r.work?r.work.substring(0,60)+(r.work.length>60?'…':''):'（作業内容なし）'}
      </div>
      <div class="history-actions">
        <button class="btn-edit" onclick="editReport('${r.id}')">✏️ 修正・再送信</button>
        <button class="btn-del-history" onclick="deleteReport('${r.id}')">🗑️ 削除</button>
      </div>
    </div>
  `).join('');
}

// 修正
function editReport(id){
  const all = JSON.parse(localStorage.getItem('daily-reports')||'[]');
  const r = all.find(x=>x.id===id);
  if(!r) return;
  switchTab('input');
  editingId = id;
  loadSiteList();
  document.getElementById('f-date').value=r.date;
  document.getElementById('f-site').value=r.site;
  document.getElementById('f-reporter').value=r.reporter||'';
  document.getElementById('f-weather').value=r.weather||'';
  document.getElementById('f-temp').value=r.temp||'';
  document.getElementById('f-work').value=r.work||'';
  document.getElementById('f-note').value=r.note||'';
  document.getElementById('f-progress').value=r.progress||50;
  document.getElementById('progress-val').textContent=(r.progress||50)+'%';
  // 保護具
  document.querySelectorAll('#safety-grid .safety-item').forEach(el=>{
    el.classList.toggle('checked', !!r.safety?.[el.dataset.key]);
  });
  // 作業員
  document.getElementById('workers-list').innerHTML='';
  workerCount=0;
  (r.workers||[]).forEach(w=>{
    addWorker();
    const last=document.getElementById('workers-list').lastElementChild;
    if(last){
      last.querySelector('.w-role').value=w.r||'';
      last.querySelector('.w-cnt').value=w.c||'';
      last.querySelector('.worker-names').value=w.names||'';
    }
  });
  if(!r.workers?.length) addWorker();
  // 材料
  document.getElementById('materials-list').innerHTML='';
  materialCount=0;
  (r.materials||[]).forEach(m=>{
    addMaterial();
    const last=document.getElementById('materials-list').lastElementChild;
    if(last){
      last.querySelector('.m-name').value=m.n||'';
      last.querySelector('.m-qty').value=m.q||'';
      last.querySelector('.m-unit').value=m.u||'';
    }
  });
  if(!r.materials?.length) addMaterial();
  // 写真スロットリセット
  document.getElementById('photos-grid').innerHTML='';
  photoSlots=[];
  addPhotoSlot();
  window.scrollTo(0,0);
  showToast('✏️ 修正モード');
}

// 削除
function deleteReport(id){
  if(!confirm('この日報を削除しますか？')) return;
  const all = JSON.parse(localStorage.getItem('daily-reports')||'[]');
  localStorage.setItem('daily-reports', JSON.stringify(all.filter(r=>r.id!==id)));
  renderHistory();
  showToast('🗑️ 削除しました');
}

// Excel出力
function renderExcel(){
  const all = JSON.parse(localStorage.getItem('daily-reports')||'[]');
  const sites = [...new Set(all.map(r=>r.site))];
  const el = document.getElementById('excel-site-list');
  if(!sites.length){ el.innerHTML='<p style="color:#9ca3af;font-size:13px">保存された日報がありません</p>'; return; }
  el.innerHTML = sites.map(s=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f3f4f6">
      <span style="font-size:13px;font-weight:600">🏗️ ${s}</span>
      <button class="btn-primary" onclick="downloadExcel('${s}')">📥 ダウンロード</button>
    </div>
  `).join('');
}

function downloadExcel(site){
  const all = JSON.parse(localStorage.getItem('daily-reports')||'[]');
  const reports = site ? all.filter(r=>r.site===site) : all;
  generateExcel(reports, site||'全現場');
}
function downloadAllExcel(){ downloadExcel(null); }

function generateExcel(reports, label){
  // SheetJSなしのCSV出力
  const header = ['日付','現場名','報告者','天気','気温','進捗(%)','作業内容','特記事項','写真枚数','作業員一覧','使用材料一覧','ヘルメット','安全帯','安全靴','防塵マスク','保護眼鏡','作業手袋(ゴム製)','保存日時'];
  const rows = reports.map(r=>{
    const wt = (r.workers||[]).filter(w=>w.r||w.c).map(w=>`${w.r||''} ${w.c?w.c+'名':''}${w.names?'('+w.names+')':''}`).join(' / ');
    const mt = (r.materials||[]).filter(m=>m.n).map(m=>`${m.n} ${m.q||''}${m.u||''}`).join(' / ');
    const s = r.safety||{};
    return [
      r.date,r.site,r.reporter||'',r.weather||'',r.temp||'',r.progress||'',
      r.work||'',r.note||'',r.photoCount||0,
      wt,mt,
      s['ヘルメット']?'○':'×',s['安全帯']?'○':'×',s['安全靴']?'○':'×',
      s['防塵マスク']?'○':'×',s['保護眼鏡']?'○':'×',s['作業手袋(ゴム製)']?'○':'×',
      r.savedAt||''
    ].map(v=>'"'+String(v).replace(/"/g,'""')+'"');
  });
  const csv = '\uFEFF'+[header.map(h=>'"'+h+'"'),...rows].map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`日報_${label}_${new Date().toISOString().substring(0,10)}.csv`;
  a.click();
  showToast('📥 ダウンロードしました');
}

// トースト
function showToast(msg, dur=2500){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}
